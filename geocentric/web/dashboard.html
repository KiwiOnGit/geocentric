<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Geocentric Training Dashboard</title>
<style>
body { margin:0; font-family: Inter, system-ui, sans-serif; background:#111; color:#eee; }
main { padding:24px; max-width:1100px; margin:0 auto; }
h1,h2 { margin:0 0 12px; }
section { background:#181818; border:1px solid rgba(255,255,255,.08); border-radius:18px; padding:18px; margin-bottom:18px; }
.row { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }
.card { background:#141414; border:1px solid rgba(255,255,255,.05); border-radius:14px; padding:18px; }
.card strong { display:block; margin-bottom:6px; color:#9bd4ff; }
.status-running { color:#6ee7b7; }
.status-stopped { color:#fda4af; }
pre { white-space:pre-wrap; word-break:break-word; color:#d4d4d4; font-size:13px; }
</style>
</head>
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Training Dashboard</title>
    <style>
      body { font-family: sans-serif; padding: 12px }
      .metric { margin-bottom: 8px }
      #chart { border: 1px solid #ddd; width: 100%; height: 240px }
      .row { display:flex; gap:12px; align-items:center }
      .col { flex:1 }
      .cmd-row { margin-top:12px }
    </style>
  </head>
  <body>
    <h1>Training Dashboard</h1>
    <div class="row">
      <div class="col">
        <h3>Metrics</h3>
        <div id="metrics">Loading...</div>
      </div>
      <div class="col">
        <h3>Utilization</h3>
        <div id="util">Loading...</div>
      </div>
    </div>

    <h3>Loss Chart</h3>
    <canvas id="chart"></canvas>

    <h3>Command Center</h3>
    <div>
      <input id="cmd" style="width:70%" placeholder="command to run, e.g. python -m geocentric.cli pretrain --config ..." />
      <button id="run">Start</button>
    </div>
    <div id="commands" class="cmd-row">No commands yet.</div>

    <script>
      const metricsEl = document.getElementById('metrics')
      const utilEl = document.getElementById('util')
      const canvas = document.getElementById('chart')
      canvas.width = canvas.clientWidth
      canvas.height = 240
      const ctx = canvas.getContext('2d')

      function drawChart(points){
        const w = canvas.width, h = canvas.height
        ctx.clearRect(0,0,w,h)
        if(points.length===0) return
        const max = Math.max(...points)
        const min = Math.min(...points)
        const range = Math.max(1e-6, max-min)
        ctx.beginPath();
        points.forEach((p,i)=>{
          const x = (i/(points.length-1||1))*(w-20)+10
          const y = h - 10 - ((p-min)/range)*(h-20)
          if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y)
        })
        ctx.strokeStyle = '#007bff'
        ctx.lineWidth = 2
        ctx.stroke()
      }

      async function loadMetrics(){
        try{
          const res = await fetch('/training-dashboard/metrics')
          if(!res.ok) { metricsEl.innerText = 'No metrics yet'; return }
          const d = await res.json()
          metricsEl.innerHTML = ''
          const keys = ['status','phase','epoch','step','loss','eval_loss','best_eval_loss']
          keys.forEach(k=>{
            const v = d[k]
            const el = document.createElement('div')
            el.className='metric'
            el.innerText = `${k}: ${v===null?'-':v}`
            metricsEl.appendChild(el)
          })
          const history = (d.history && d.history.loss) ? d.history.loss : []
          drawChart(history.slice(-200))
        }catch(e){ metricsEl.innerText = 'Error loading metrics' }
      }

      async function loadUtil(){
        try{
          const res = await fetch('/training-dashboard/system')
          if(!res.ok) { utilEl.innerText = 'No util data'; return }
          const j = await res.json()
          utilEl.innerHTML = ''
          utilEl.appendChild(Object.assign(document.createElement('div'),{innerText:`CPU: ${j.cpu_percent}%`}))
          utilEl.appendChild(Object.assign(document.createElement('div'),{innerText:`Memory: ${j.memory_percent}%`}))
          if(j.gpu) {
            utilEl.appendChild(Object.assign(document.createElement('div'),{innerText:`GPU util: ${j.gpu.util_percent}%`}))
            utilEl.appendChild(Object.assign(document.createElement('div'),{innerText:`GPU mem: ${j.gpu.memory_used}/${j.gpu.memory_total} MiB`}))
          }
        }catch(e){ utilEl.innerText = 'Error loading util' }
      }

      // Command center
      async function listCommands(){
        const res = await fetch('/command-center/list')
        if(!res.ok){ document.getElementById('commands').innerText='Cannot list commands'; return }
        const data = await res.json()
        const rows = document.createElement('div')
        for(const id in data){
          const r = data[id]
          const el = document.createElement('div')
          el.innerText = `${r.id} PID:${r.pid} ${r.status} ${r.cmd}`
          const stop = document.createElement('button')
          stop.innerText='Stop'
          stop.onclick = async ()=>{ await fetch('/command-center/stop',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:r.id})}); listCommands() }
          el.appendChild(stop)
          const pause = document.createElement('button')
          pause.innerText='Pause'
          pause.onclick = async ()=>{ await fetch('/command-center/pause',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:r.id})}); listCommands() }
          el.appendChild(pause)
          const resume = document.createElement('button')
          resume.innerText='Resume'
          resume.onclick = async ()=>{ await fetch('/command-center/resume',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:r.id})}); listCommands() }
          el.appendChild(resume)
          rows.appendChild(el)
        }
        const container = document.getElementById('commands')
        container.innerHTML = ''
        container.appendChild(rows)
      }

      document.getElementById('run').addEventListener('click', async ()=>{
        const cmd = document.getElementById('cmd').value
        if(!cmd) return alert('enter a command')
        await fetch('/command-center/start',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({cmd})})
        document.getElementById('cmd').value=''
        setTimeout(listCommands,500)
      })

      setInterval(loadMetrics,2000)
      setInterval(loadUtil,2000)
      setInterval(listCommands,3000)
      loadMetrics(); loadUtil(); listCommands();
    </script>
  </body>
</html>
    <pre id="config">Loading…</pre>
  </section>

  <section>
    <h2>Messages</h2>
    <pre id="message">Loading…</pre>
  </section>
</main>
<script>
async function refresh() {
  try {
    const res = await fetch('/training-dashboard/metrics');
    if (!res.ok) throw new Error(res.statusText);
    const metrics = await res.json();
    document.getElementById('status').textContent = metrics.status;
    document.getElementById('phase').textContent = metrics.phase;
    document.getElementById('epoch').textContent = `${metrics.epoch}/${metrics.epochs}`;
    document.getElementById('step').textContent = metrics.step;
    document.getElementById('batch').textContent = metrics.batch;
    document.getElementById('loss').textContent = metrics.loss ?? '—';
    document.getElementById('ppl').textContent = metrics.perplexity ?? '—';
    document.getElementById('eval_loss').textContent = metrics.eval_loss ?? '—';
    document.getElementById('best_eval_loss').textContent = metrics.best_eval_loss ?? '—';
    document.getElementById('gradient_accumulation_steps').textContent = metrics.gradient_accumulation_steps ?? '—';
    document.getElementById('use_scaler').textContent = metrics.use_scaler ? 'yes' : 'no';
    document.getElementById('start_time').textContent = metrics.start_time ?? '—';
    document.getElementById('config').textContent = JSON.stringify(metrics.config ?? {}, null, 2);
    document.getElementById('message').textContent = metrics.message ?? '—';
    document.getElementById('status').className = metrics.status === 'running' ? 'status-running' : 'status-stopped';
  } catch (error) {
    document.getElementById('status').textContent = 'error';
    document.getElementById('message').textContent = error.message;
  }
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>

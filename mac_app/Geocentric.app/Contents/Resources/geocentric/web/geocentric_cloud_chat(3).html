<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Geocentric</title>
<meta name="description" content="Geocentric AI chat" />
<meta name="theme-color" content="#343541" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Geocentric" />
<link rel="icon" href="appicon.png" />
<link rel="apple-touch-icon" href="appicon.png" />
<style>
:root {
  color-scheme: dark;
  --sidebar: #202123;
  --main: #343541;
  --main-soft: #3b3c49;
  --panel: #3e3f4d;
  --panel-hover: #464756;
  --assistant-row: #444654;
  --line: rgba(255,255,255,.13);
  --line-soft: rgba(255,255,255,.075);
  --text: #f7f7f8;
  --muted: #d1d5db;
  --faint: #9ca3af;
  --subtle: #8e8ea0;
  --accent: #10a37f;
  --danger: #ef4444;
  --sidebar-w: 272px;
  --radius: 6px;
  --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --shadow: 0 22px 80px rgba(0,0,0,.38);
  /* Syntax highlight */
  --hl-comment: #8b949e;
  --hl-string: #a5d6a7;
  --hl-number: #79c0ff;
  --hl-keyword: #ff7b72;
  --hl-function: #d2a8ff;
  --hl-boolean: #ffa657;
  --hl-property: #79c0ff;
  --hl-tag: #7ee787;
  --hl-attr: #ffa657;
}

html[data-theme="light"] {
  color-scheme: light;
  --sidebar: #f7f7f8;
  --main: #ffffff;
  --main-soft: #f3f4f6;
  --panel: #f7f7f8;
  --panel-hover: #ececf1;
  --assistant-row: #f7f7f8;
  --line: rgba(0,0,0,.14);
  --line-soft: rgba(0,0,0,.08);
  --text: #202123;
  --muted: #374151;
  --faint: #6b7280;
  --subtle: #8e8ea0;
}

* { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}
body {
  font-family: var(--font);
  background: var(--main);
  color: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  height: var(--viewport-height, 100%);
}
button, input, textarea { font: inherit; }
button { cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.icon { width: 18px; height: 18px; stroke-width: 2; flex: 0 0 auto; }
.icon.small { width: 15px; height: 15px; }
.icon.large { width: 26px; height: 26px; }

.app {
  height: 100vh;
  height: 100dvh;
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  background: var(--main);
  overflow: hidden;
}

.sidebar {
  min-width: 0;
  background: var(--sidebar);
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--line-soft);
  padding: 10px;
}

.new-chat {
  width: 100%;
  height: 50px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: transparent;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 14px;
  text-align: left;
  font-size: 15px;
  font-weight: 600;
  transition: background .15s ease, border-color .15s ease;
}
.new-chat:hover { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.24); }
html[data-theme="light"] .new-chat:hover { background: rgba(0,0,0,.045); }

.sidebar-title {
  margin: 18px 8px 8px;
  color: var(--subtle);
  font-size: 12px;
  font-weight: 600;
}
.chat-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-right: 2px;
}
.chat-list::-webkit-scrollbar { width: 5px; }
.chat-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.17); border-radius: 999px; }
html[data-theme="light"] .chat-list::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); }

.chat-item {
  min-height: 42px;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: var(--muted);
  display: grid;
  grid-template-columns: 18px 1fr 28px;
  align-items: center;
  gap: 9px;
  padding: 0 6px 0 10px;
  text-align: left;
}
.chat-item:hover, .chat-item.active { background: rgba(255,255,255,.075); color: var(--text); }
html[data-theme="light"] .chat-item:hover, html[data-theme="light"] .chat-item.active { background: rgba(0,0,0,.06); }
.chat-item-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.chat-delete {
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--faint);
  opacity: 0;
  display: grid;
  place-items: center;
}
.chat-item:hover .chat-delete { opacity: 1; }
.chat-delete:hover { color: #fecaca; background: rgba(239,68,68,.14); }

.sidebar-bottom {
  border-top: 1px solid var(--line);
  padding-top: 10px;
  display: grid;
  gap: 4px;
}
.side-btn, .account-chip {
  width: 100%;
  min-height: 44px;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px;
  text-align: left;
  text-decoration: none;
}
.side-btn:hover, .account-chip:hover { background: rgba(255,255,255,.075); }
html[data-theme="light"] .side-btn:hover, html[data-theme="light"] .account-chip:hover { background: rgba(0,0,0,.06); }
.account-chip { display: flex; }
.account-avatar {
  width: 28px;
  height: 28px;
  border-radius: 4px;
  object-fit: cover;
  background: var(--panel);
  border: 1px solid var(--line-soft);
}
.account-text { min-width: 0; display: grid; gap: 1px; }
.account-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.account-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--faint); }
#logoutBtn { display: none; }
body.signed-in #logoutBtn { display: flex; }
body.signed-in #sidebarAuthBtn { display: none; }

.main {
  min-width: 0;
  height: 100%;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  position: relative;
  overflow: hidden;
}
.mobile-topbar { display: none; }

.messages-wrap {
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--main);
}
.messages-wrap::-webkit-scrollbar { width: 8px; }
.messages-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 999px; }
html[data-theme="light"] .messages-wrap::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); }
.messages { min-height: 100%; padding-bottom: 64px; }

.empty-state {
  min-height: 100%;
  display: grid;
  place-items: center;
  padding: 44px 24px 128px;
}
.empty-inner {
  width: min(900px, 100%);
  text-align: center;
}
.empty-title {
  margin: 0 0 62px;
  font-size: clamp(34px, 4.6vw, 44px);
  line-height: 1;
  letter-spacing: -.055em;
  font-weight: 700;
}
.home-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  max-width: 900px;
  margin: 0 auto;
}
.home-col { display: grid; gap: 13px; align-content: start; }
.home-head {
  display: grid;
  place-items: center;
  gap: 12px;
  margin-bottom: 6px;
  color: var(--text);
  font-size: 18px;
  font-weight: 500;
}
.home-card {
  min-height: 72px;
  border: 0;
  border-radius: 7px;
  background: var(--panel);
  color: var(--text);
  padding: 14px 16px;
  display: grid;
  place-items: center;
  text-align: center;
  font-size: 14px;
  line-height: 1.45;
  white-space: normal;
}
button.home-card:hover { background: var(--panel-hover); }
.home-card.muted { cursor: default; }

.message-row { border-bottom: 1px solid rgba(255,255,255,.08); }
html[data-theme="light"] .message-row { border-bottom-color: rgba(0,0,0,.08); }
.message-row.assistant { background: var(--assistant-row); }
.message-inner {
  width: min(840px, 100%);
  margin: 0 auto;
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr);
  gap: 18px;
  padding: 24px 22px;
}
.avatar {
  width: 30px;
  height: 30px;
  border-radius: 4px;
  display: grid;
  place-items: center;
  color: white;
  overflow: hidden;
}
.avatar.user { background: #64748b; }
.avatar.assistant { background: var(--panel); border: 1px solid var(--line-soft); }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar .fallback { font-size: 13px; font-weight: 800; }
.msg-content {
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: break-word;
  padding-top: 1px;
  font-size: 16px;
  min-width: 0;
  max-width: 100%;
}
.msg-content-wrap {
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
}
.msg-content p { margin: 0 0 .8em; }
.msg-content p:last-child { margin-bottom: 0; }
.msg-content code {
  background: rgba(0,0,0,.22);
  border: 1px solid rgba(255,255,255,.08);
  padding: 2px 5px;
  border-radius: 4px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: .9em;
  color: var(--text);
}
html[data-theme="light"] .msg-content code {
  background: rgba(0,0,0,.07);
  border-color: rgba(0,0,0,.1);
}
.msg-content pre {
  margin: 12px 0;
  overflow-x: auto;
  max-width: 100%;
  background: #111318;
  border: 1px solid rgba(255,255,255,.1);
}
.msg-content pre code { background: transparent; border: 0; padding: 0; }

/* Code block wrapper with header */
.code-block {
  margin: 12px 0;
  border-radius: 8px;
  background: #111318;
  border: 1px solid rgba(255,255,255,.1);
  overflow: hidden;
  max-width: 100%;
}
.code-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 12px;
  background: rgba(255,255,255,.04);
  border-bottom: 1px solid rgba(255,255,255,.07);
  min-height: 36px;
}
.code-lang {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 11px;
  color: var(--subtle);
  text-transform: lowercase;
  letter-spacing: .04em;
}
.copy-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--faint);
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 5px;
  cursor: pointer;
  transition: color .15s, background .15s, border-color .15s;
  flex-shrink: 0;
}
.copy-btn:hover { color: var(--text); background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.12); }
.copy-btn.copied { color: var(--accent); }
.code-block pre {
  margin: 0;
  padding: 14px 16px;
  overflow-x: auto;
  background: transparent;
  border-radius: 0;
  border: 0;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: .87em;
  line-height: 1.6;
}
.code-block code {
  background: transparent;
  border: 0;
  padding: 0;
  font-family: inherit;
  font-size: inherit;
}
/* Syntax highlight spans */
.hl-comment { color: var(--hl-comment); font-style: italic; }
.hl-string   { color: var(--hl-string); }
.hl-number   { color: var(--hl-number); }
.hl-keyword  { color: var(--hl-keyword); font-weight: 600; }
.hl-function { color: var(--hl-function); }
.hl-boolean  { color: var(--hl-boolean); }
.hl-property { color: var(--hl-property); }
.hl-tag      { color: var(--hl-tag); }
.hl-attr     { color: var(--hl-attr); }
.typing > *:last-child::after {
  content: "";
  display: inline-block;
  width: 8px;
  height: 19px;
  margin-left: 4px;
  background: var(--muted);
  vertical-align: -4px;
  animation: blink 1s steps(2,start) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.composer-wrap {
  padding: 16px 18px calc(24px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--main) 82%, rgba(52,53,65,0));
}
.composer {
  width: min(860px, 100%);
  margin: 0 auto;
  background: var(--panel);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 6px;
  box-shadow: 0 0 15px rgba(0,0,0,.13);
  display: grid;
  grid-template-columns: 1fr 46px;
  align-items: end;
}
html[data-theme="light"] .composer { border-color: rgba(0,0,0,.14); }
.composer:focus-within { border-color: rgba(255,255,255,.28); }
html[data-theme="light"] .composer:focus-within { border-color: rgba(0,0,0,.28); }
#chatInput {
  width: 100%;
  min-height: 54px;
  max-height: 190px;
  resize: none;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  padding: 16px 0 15px 16px;
  line-height: 1.45;
}
#chatInput::placeholder { color: #b5b5c3; }
html[data-theme="light"] #chatInput::placeholder { color: #6b7280; }
.send-btn {
  width: 34px;
  height: 34px;
  margin: 10px 8px 10px 0;
  border: 0;
  border-radius: 6px;
  color: var(--text);
  background: transparent;
  display: grid;
  place-items: center;
}
.send-btn:hover:not(:disabled) { background: rgba(255,255,255,.13); }
html[data-theme="light"] .send-btn:hover:not(:disabled) { background: rgba(0,0,0,.08); }
.send-btn:disabled { opacity: .35; cursor: default; }
.composer-note {
  width: min(860px, 100%);
  margin: 10px auto 0;
  color: var(--subtle);
  font-size: 12px;
  text-align: center;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(8px);
}
.modal-backdrop.hidden { display: none; }
.modal {
  width: min(440px, 100%);
  background: var(--sidebar);
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
html[data-theme="light"] .modal { border-color: rgba(0,0,0,.14); }
.modal-head {
  padding: 20px 22px 15px;
  border-bottom: 1px solid var(--line-soft);
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 14px;
}
.modal-title { margin: 0; font-size: 23px; letter-spacing: -.02em; }
.modal-close {
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--muted);
  display: grid;
  place-items: center;
}
.modal-close:hover { background: rgba(255,255,255,.08); color: var(--text); }
html[data-theme="light"] .modal-close:hover { background: rgba(0,0,0,.06); }
.auth-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: rgba(0,0,0,.24);
  padding: 4px;
  margin: 16px 22px 0;
  border-radius: var(--radius);
}
html[data-theme="light"] .auth-tabs { background: rgba(0,0,0,.06); }
.auth-tab {
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: 5px;
  padding: 10px;
}
.auth-tab.active { background: var(--panel); color: var(--text); }
.modal-body { padding: 20px 22px 22px; }
.form { display: grid; gap: 13px; }
.form.hidden { display: none; }
.field { display: grid; gap: 6px; }
.field label { color: var(--muted); font-size: 13px; }
.field input {
  width: 100%;
  height: 44px;
  border-radius: var(--radius);
  border: 1px solid rgba(255,255,255,.14);
  background: var(--main-soft);
  color: var(--text);
  outline: 0;
  padding: 0 12px;
}
html[data-theme="light"] .field input { border-color: rgba(0,0,0,.14); }
.field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(16,163,127,.16); }
.primary {
  height: 44px;
  border: 0;
  border-radius: var(--radius);
  background: var(--accent);
  color: white;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.primary:hover:not(:disabled) { filter: brightness(1.08); }
.primary:disabled { opacity: .65; cursor: wait; }
.error {
  display: none;
  color: #fecaca;
  background: rgba(239,68,68,.15);
  border: 1px solid rgba(239,68,68,.35);
  border-radius: var(--radius);
  padding: 10px 12px;
  font-size: 13px;
}
.error.show { display: block; }
.toast {
  position: fixed;
  z-index: 90;
  left: 50%;
  bottom: 88px;
  transform: translateX(-50%) translateY(20px);
  opacity: 0;
  pointer-events: none;
  background: var(--sidebar);
  color: var(--text);
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 8px;
  padding: 10px 14px;
  box-shadow: 0 14px 40px rgba(0,0,0,.35);
  transition: opacity .18s ease, transform .18s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.sidebar-shade {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.46);
  z-index: 30;
}

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .main { grid-template-rows: auto minmax(0, 1fr) auto; }
  #chatInput, input, textarea { font-size: 16px !important; }
  .mobile-topbar {
    padding-top: env(safe-area-inset-top, 0px);
    height: calc(50px + env(safe-area-inset-top, 0px));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    border-bottom: 1px solid var(--line-soft);
    background: var(--main);
  }
  .mobile-brand { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 700; font-size: 15px; }
  .mobile-brand img { width: 26px; height: 26px; border-radius: 6px; object-fit: cover; }
  .menu-btn {
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: var(--radius);
    color: var(--text);
    background: transparent;
    display: grid;
    place-items: center;
  }
  .menu-btn:hover { background: rgba(255,255,255,.075); }
  html[data-theme="light"] .menu-btn:hover { background: rgba(0,0,0,.06); }
  .sidebar {
    position: fixed;
    z-index: 40;
    left: 0;
    top: 0;
    bottom: 0;
    width: var(--sidebar-w);
    transform: translateX(-100%);
    transition: transform .2s ease;
    box-shadow: 18px 0 60px rgba(0,0,0,.38);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-shade.show { display: block; }
  .home-grid { grid-template-columns: 1fr; max-width: 460px; }
  .empty-title { margin-bottom: 28px; font-size: clamp(26px, 7vw, 34px); }
  .empty-state { padding-top: 18px; }
  /* Tighten message rows on mobile */
  .message-inner { padding: 16px 14px; gap: 12px; }
  .msg-content { font-size: 15px; }
  /* Tighten model dropdown on mobile */
  .model-dropdown { max-width: calc(100vw - 24px); }
}

@media (max-width: 560px) {
  .message-inner { grid-template-columns: 24px minmax(0, 1fr); gap: 10px; padding: 14px 12px; }
  .avatar { width: 24px; height: 24px; }
  .msg-content { font-size: 14px; line-height: 1.65; }
  .composer-wrap { padding: 10px 10px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .composer-note { font-size: 11px; }
  .empty-state { padding: 16px 12px 90px; }
  .empty-title { font-size: clamp(22px, 6.5vw, 28px); margin-bottom: 20px; }
  .home-card { min-height: 52px; font-size: 13px; padding: 10px 12px; }
  .home-head { font-size: 16px; }
  #chatInput { min-height: 46px; padding: 12px 0 12px 14px; font-size: 15px; }
  .send-btn { width: 32px; height: 32px; margin: 7px 7px 7px 0; }
  .code-block pre { padding: 10px 12px; font-size: .82em; }
  .code-header { padding: 6px 10px; }
}

/* Premium Multimodal UI Extensions */
.chat-header {
  height: 54px;
  padding: 0 20px;
  border-bottom: 1px solid var(--line-soft);
  background: var(--main);
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 10;
}
.model-select-container {
  position: relative;
}
.model-select-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  background: transparent;
  border: 0;
  color: var(--text);
  font-size: 16px;
  font-weight: 600;

<script>
const APP_ICON = "appicon.png";
const API = {
  base: window.GEOCENTRIC_API_BASE || "/api",
  login: "/auth/login",
  signup: "/auth/signup",
  logout: "/auth/logout",
  chat: "/chat",
  chats: "/chats",
  model: window.GEOCENTRIC_MODEL || "geocentric-local"
};

const MODEL_MODES = [
  {
    id: "thinking",
    label: "Geocentric Thinking",
    desc: "Tiny grey reasoning preview, then the answer.",
    icon: "brain"
  },
  {
    id: "instant",
    label: "Geocentric Instant",
    desc: "Fast direct replies with no visible thinking.",
    icon: "zap"
  }
];

const INSTANT_MODE_SYSTEM_PROMPT = [
  "Answer immediately and directly.",

const ICONS = {
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 7.5A9 9 0 1 1 12 3Z"/>',
  zap: '<path d="M4 14a1 1 0 0 1 .78-1l6.72-1.49L13 4.78A1 1 0 0 1 14.9 4L20 13a1 1 0 0 1-.78 1l-6.72 1.49L11 22.22A1 1 0 0 1 9.1 23Z"/>',
  triangleAlert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  lightbulb: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5A4.8 4.8 0 0 0 18 8 6 6 0 0 0 6 8c0 1.3.5 2.5 1.5 3.5.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/><path d="M10 18a2 2 0 1 0 4 0"/>',
  messageSquare: '<path d="M21 15a4 4 0 0 1-4 4H7l-4 4V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>',
  messagesSquare: '<path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/>',
  trash2: '<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>',
  logIn: '<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/>',
  logOut: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
  userCircle: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M7 20.7a6 6 0 0 1 10 0"/>',
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  userPlus: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  sendHorizontal: '<path d="m3 3 3 9-3 9 19-9Z"/><path d="M6 12h16"/>',
  panelLeft: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>',
  externalLink: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  chevronDown: '<path d="m6 9 6 6 6-6"/>',
  copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  brain: '<path d="M12 5a3 3 0 0 0-5.2-2 3.5 3.5 0 0 0-4.3 4.6A3.5 3.5 0 0 0 4 14.5V17a3 3 0 0 0 3 3h1"/><path d="M12 5a3 3 0 0 1 5.2-2 3.5 3.5 0 0 1 4.3 4.6A3.5 3.5 0 0 1 20 14.5V17a3 3 0 0 1-3 3h-1"/><path d="M12 5v16"/><path d="M8 8.5a2 2 0 0 1 2 2"/><path d="M16 8.5a2 2 0 0 0-2 2"/><path d="M8 15a2 2 0 0 0 2-2"/><path d="M16 15a2 2 0 0 1-2-2"/>',
  sparkles: '<path d="M9.9 2.8 11.3 7l4.2 1.4-4.2 1.4-1.4 4.2-1.4-4.2-4.2-1.4L8.5 7Z"/><path d="m18 13 .8 2.2L21 16l-2.2.8L18 19l-.8-2.2L15 16l2.2-.8Z"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>'
};

function iconSvg(name, className = "icon") {
  const key = name.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
  const body = ICONS[key] || ICONS.messageSquare;
  return `<svg class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
}

function hydrateIcons(root = document) {
  root.querySelectorAll("[data-icon]").forEach(el => {
    const name = el.getAttribute("data-icon");
    const className = el.getAttribute("class") || "icon";
    el.outerHTML = iconSvg(name, className);
  });
}

const storage = {
  get(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
    catch { return fallback; }
  },
  set(key, value) { localStorage.setItem(key, JSON.stringify(value)); },
  remove(key) { localStorage.removeItem(key); }
};

const $ = id => document.getElementById(id);
const els = {
  sidebar: $("sidebar"),
  sidebarShade: $("sidebarShade"),
  chatList: $("chatList"),
  messages: $("messages"),
  messagesWrap: $("messagesWrap"),
  chatInput: $("chatInput"),
  sendBtn: $("sendBtn"),
  authModal: $("authModal"),
  loginTab: $("loginTab"),
  signupTab: $("signupTab"),
  loginForm: $("loginForm"),
  signupForm: $("signupForm"),
  loginError: $("loginError"),
  signupError: $("signupError"),
  accountName: $("accountName"),
  accountSub: $("accountSub"),
  sidebarAuthBtn: $("sidebarAuthBtn"),
  toast: $("toast"),
  themeLabel: $("themeLabel"),
  modelSelectBtn: $("modelSelectBtn"),
  modelSelectName: $("modelSelectName"),
  modelDropdown: $("modelDropdown"),
  attachBtn: $("attachBtn"),
  attachmentInput: $("attachmentInput"),
  attachmentPreviewContainer: $("attachmentPreviewContainer"),
  modeThinkingBtn: $("modeThinkingBtn"),
  modeInstantBtn: $("modeInstantBtn"),
  searchWebBtn: $("searchWebBtn")
};

const state = {
  token: storage.get("geo_token", ""),
  user: storage.get("geo_user", null),
  chats: storage.get("geo_chats_v4", []),
  activeChatId: storage.get("geo_active_chat_id_v4", ""),
  theme: storage.get("geo_theme", "dark"),
  modelMode: storage.get("geo_model_mode", "thinking"),
  busy: false,
  attachments: [], // Stores base64 strings of currently attached files
  searchWeb: false // Web search toggle status
};

function uuid() {
  return crypto?.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

function endpoint(path) {
  const base = (API.base || "").replace(/\/$/, "");
  const cleanPath = path.startsWith("/") ? path : `/${path}`;
  return `${base}${cleanPath}`;
}

async function postJson(path, payload) {
  const headers = { "Content-Type": "application/json" };
  if (state.token) headers.Authorization = `Bearer ${state.token}`;

  const res = await fetch(endpoint(path), {
    method: "POST",
    headers,
    credentials: "include",
    body: JSON.stringify(payload)
  });

  if (res.headers.get("content-type")?.includes("text/event-stream")) {
    if (!res.ok) throw new Error(`Request failed: ${res.status}`);
    return res;
  }

  const text = await res.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; }
  catch { data = { text }; }

  if (!res.ok) throw new Error(data.error || data.message || data.detail || `Request failed: ${res.status}`);
  return data;
}

function extractReply(data) {
  if (typeof data === "string") return data;
  return data.reply
    || data.content
    || data.text
    || data.output
    || data.delta?.content
    || data.message?.content
    || data.message
    || data.choices?.[0]?.message?.content
    || data.choices?.[0]?.delta?.content
    || "";
}

function extractThinking(data) {
  if (!data || typeof data === "string") return "";
  return data.reasoning
    || data.thinking
    || data.thought
    || data.thoughts
    || data.reasoning_content
    || data.delta?.reasoning
    || data.delta?.thinking
    || data.delta?.thought
    || data.delta?.reasoning_content
    || data.message?.reasoning
    || data.message?.thinking
    || data.message?.thought
    || data.message?.reasoning_content
    || data.choices?.[0]?.message?.reasoning
    || data.choices?.[0]?.message?.reasoning_content
    || data.choices?.[0]?.delta?.reasoning
    || data.choices?.[0]?.delta?.thinking
    || data.choices?.[0]?.delta?.thought
    || data.choices?.[0]?.delta?.reasoning_content
    || "";
}

function splitThinkingBlocks(value) {
  const src = String(value || "");
  const thoughts = [];
  let visible = "";
  let index = 0;
  const openTag = /<think>/ig;
  while (index < src.length) {
    openTag.lastIndex = index;
    const open = openTag.exec(src);
    if (!open) {
      visible += src.slice(index);
      break;
    }
    visible += src.slice(index, open.index);
    const close = src.toLowerCase().indexOf("</think>", openTag.lastIndex);
    if (close === -1) {
      thoughts.push(src.slice(openTag.lastIndex));
      break;
    }
    thoughts.push(src.slice(openTag.lastIndex, close));
    index = close + "</think>".length;
  }
  return { visible, thoughts };
}

function cleanThinkingLine(value) {
  return String(Array.isArray(value) ? value.join(" ") : value || "")
    .replace(/<\/?think>/gi, "")
    .replace(/\s+/g, " ")
    .trim();
}

async function readSse(res, onChunk) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const packets = buffer.split("\n\n");
    buffer = packets.pop() || "";
    for (const packet of packets) {
      const lines = packet.split("\n").filter(line => line.startsWith("data:"));
      for (const line of lines) {
        const raw = line.replace(/^data:\s?/, "");
        if (raw === "[DONE]") return;
        try {
          const parsed = JSON.parse(raw);
          onChunk(extractReply(parsed), extractThinking(parsed), parsed);
        }
        catch { onChunk(raw, "", null); }
      }
    }
  }
}

async function saveChatToServer(chat) {
  if (!state.token) return;
  try {
    await postJson(API.chats, chat);
  } catch (err) {

  }
}

async function loadChatsFromServer() {
  if (!state.token) return;
  try {
    const headers = {};
    if (state.token) headers.Authorization = `Bearer ${state.token}`;
    const res = await fetch(endpoint(API.chats), { headers });
    if (res.ok) {
      const data = await res.json();
      const serverChats = data.chats || [];
      const localChats = state.chats || [];
      
      // Auto-upload/merge guest chats that have messages and don't exist on server yet
      for (const localChat of localChats) {
        if (localChat.messages.length > 0 && !serverChats.some(sc => sc.id === localChat.id)) {
          await saveChatToServer(localChat);
          serverChats.unshift(localChat);
        }
      }
      
      state.chats = serverChats;
      if (state.chats.length > 0) {
        if (!state.chats.some(c => c.id === state.activeChatId)) {
          state.activeChatId = state.chats[0].id;
        }
      } else {
        state.activeChatId = "";
      }
      storage.set("geo_chats_v4", state.chats.slice(0, 100));
      storage.set("geo_active_chat_id_v4", state.activeChatId);
      renderChatList();
      renderMessages();
    }
  } catch (err) {
    console.error("Failed to load chats from user profile:", err);
  }
}

  if (!chat) {

function escapeHtml(value) {
  return String(value).replace(/[&<>'"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[ch]));
}

function syntaxHighlight(code, lang) {
  if (!lang) return code;
  const L = lang.toLowerCase();
  const normL = {jsx:'js',tsx:'ts',sh:'bash',shell:'bash',zsh:'bash',kt:'java',kotlin:'java',c:'c',cpp:'cpp'}[L] || L;
  const saved = [];
  function save(str, cls) {
    const i = saved.length;
    saved.push(cls ? `<span class="hl-${cls}">${str}</span>` : str);
    return `\x02${i.toString(36)}\x02`;
  }
  let r = code;
  // Block comments
  if (['js','ts','jsx','tsx','c','cpp','java','swift','go','rust','css','scss','php','kotlin','kt'].some(x=>x===L||x===normL)) {
    r = r.replace(/\/\*[\s\S]*?\*\//g, m => save(m,'comment'));
  }
  // HTML/XML comments
  if (['html','xml'].includes(L)) r = r.replace(/&lt;!--[\s\S]*?--&gt;/g, m => save(m,'comment'));
  // SQL comments
  if (L==='sql') r = r.replace(/--[^\n]*/g, m => save(m,'comment'));
  // Line comments //
  if (['js','ts','jsx','tsx','c','cpp','java','swift','go','rust','php'].some(x=>x===L||x===normL)) {
    r = r.replace(/\/\/[^\n]*/g, m => save(m,'comment'));
  }
  // Hash comments
  if (['py','python','ruby','bash','sh','shell','zsh'].some(x=>x===L)) {
    r = r.replace(/#[^\n]*/g, m => save(m,'comment'));
  }
  // CSS comments
  if (['css','scss'].includes(L)) r = r.replace(/\/\*[\s\S]*?\*\//g, m => save(m,'comment'));

  // Python triple-quoted strings
  if (['py','python'].includes(L)) r = r.replace(/"""[\s\S]*?"""|'''[\s\S]*?'''/g, m => save(m,'string'));
  // Template literals
  if (['js','ts','jsx','tsx'].some(x=>x===L)) r = r.replace(/`[^`]*`/g, m => save(m,'string'));
  // Double-quoted strings
  r = r.replace(/"(?:[^"\\]|\\.)*"/g, m => save(m,'string'));
  // Single-quoted strings
  r = r.replace(/'(?:[^'\\]|\\.)*'/g, m => save(m,'string'));

  // HTML/XML tags & attrs
  if (['html','xml'].includes(L)) {
    r = r.replace(/(&lt;\/?)([\w-]+)/g, (_,b,t) => `${save(b+t,'tag')}`);
    r = r.replace(/([\w-]+)(?==)/g, m => save(m,'attr'));
  }

  // Numbers
  r = r.replace(/\b-?\d+\.?\d*(?:[eE][+-]?\d+)?\b/g, m => save(m,'number'));

  // Keywords by language
  const KW = {
    js:   'async|await|break|case|catch|class|const|continue|debugger|default|delete|do|else|export|extends|finally|for|from|function|if|import|in|instanceof|let|new|of|return|static|super|switch|this|throw|try|typeof|var|void|while|with|yield',
    ts:   'abstract|as|async|await|break|case|catch|class|const|continue|declare|default|delete|do|else|enum|export|extends|finally|for|from|function|if|implements|import|in|instanceof|interface|keyof|let|namespace|new|of|readonly|return|static|super|switch|this|throw|try|type|typeof|var|void|while|yield',
    py:   'and|as|assert|async|await|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|nonlocal|not|or|pass|raise|return|try|while|with|yield',
    java: 'abstract|assert|boolean|break|byte|case|catch|char|class|const|continue|default|do|double|else|enum|extends|final|finally|float|for|if|implements|import|instanceof|int|interface|long|native|new|package|private|protected|public|return|short|static|strictfp|super|switch|synchronized|this|throw|throws|transient|try|var|void|volatile|while',
    go:   'break|case|chan|const|continue|default|defer|else|fallthrough|for|func|go|goto|if|import|interface|map|package|range|return|select|struct|switch|type|var',
    rust: 'as|break|const|continue|crate|dyn|else|enum|extern|fn|for|if|impl|in|let|loop|match|mod|move|mut|pub|ref|return|self|static|struct|super|trait|type|unsafe|use|where|while|async|await',
    sql:  'SELECT|FROM|WHERE|JOIN|LEFT|RIGHT|INNER|OUTER|CROSS|ON|GROUP|BY|ORDER|HAVING|LIMIT|OFFSET|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|DROP|ALTER|ADD|COLUMN|INDEX|PRIMARY|FOREIGN|KEY|REFERENCES|NOT|NULL|AND|OR|AS|DISTINCT|COUNT|SUM|AVG|MIN|MAX|BETWEEN|LIKE|IN|EXISTS|UNION|ALL|CASE|WHEN|THEN|END',
    bash: 'if|then|else|elif|fi|for|while|do|done|case|esac|in|function|return|echo|exit|source|local|export|readonly|declare|unset|shift|break|continue',
    php:  'abstract|and|array|as|break|callable|case|catch|class|clone|const|continue|declare|default|do|echo|else|elseif|extends|final|finally|fn|for|foreach|function|global|if|implements|interface|match|namespace|new|or|private|protected|public|require|return|static|switch|throw|trait|try|use|var|while|yield',
    ruby: 'BEGIN|END|alias|and|begin|break|case|class|def|do|else|elsif|end|ensure|for|if|in|module|next|not|or|redo|rescue|retry|return|self|super|then|undef|unless|until|when|while|yield',
    swift:'associatedtype|class|deinit|enum|extension|fileprivate|func|import|init|inout|internal|let|open|operator|private|protocol|public|rethrows|static|struct|subscript|typealias|var|break|case|continue|default|defer|do|else|fallthrough|for|guard|if|in|repeat|return|throw|switch|where|while|as|catch|throws|try',
    c:    'auto|break|case|char|const|continue|default|do|double|else|enum|extern|float|for|goto|if|inline|int|long|register|return|short|signed|sizeof|static|struct|switch|typedef|union|unsigned|void|volatile|while',
    cpp:  'auto|break|case|catch|char|class|const|constexpr|continue|default|delete|do|double|else|enum|explicit|extern|float|for|friend|goto|if|inline|int|long|mutable|namespace|new|noexcept|nullptr|operator|override|private|protected|public|register|return|short|signed|sizeof|static|struct|switch|template|this|throw|try|typedef|typename|union|unsigned|using|virtual|void|volatile|while',
  };
  const kwStr = KW[normL] || KW[L];
  if (kwStr) r = r.replace(new RegExp(`\\b(${kwStr})\\b`,'g'), m => save(m,'keyword'));

  // Booleans / null / special values
  r = r.replace(/\b(true|false|null|undefined|None|True|False|nil|NULL|NaN|Infinity)\b/g, m => save(m,'boolean'));

  // Function/method calls
  if (!['html','xml','css','scss','sql','bash'].includes(L)) {
    r = r.replace(/\b([a-zA-Z_$][\w$]*)\s*(?=\()/g, (m, name) => save(name,'function') + m.slice(name.length));
  }

  // CSS properties
  if (['css','scss'].includes(L)) {
    r = r.replace(/^(\s*)([a-z-]+)(\s*:)/gm, (_,s,p,c) => `${s}${save(p,'property')}${c}`);
  }
  // JSON keys
  if (L==='json') {
    r = r.replace(/"([^"]+)"(?=\s*:)/g, m => save(m,'property'));
  }

  // Restore all placeholders
  saved.forEach((html, i) => { r = r.split(`\x02${i.toString(36)}\x02`).join(html); });
  return r;
}

let _copyTimer = {};
function copyCode(btn, codeId) {
  const el = document.getElementById(codeId);
  if (!el) return;
  const text = el.innerText || el.textContent || '';
  const label = btn.querySelector('span');
  const orig = label ? label.textContent : '';
  function onSuccess() {
    btn.classList.add('copied');
    if (label) { label.textContent = 'Copied!'; btn.innerHTML = btn.innerHTML.replace(/stroke="currentColor"/,'style="display:none"'); }
    // swap icon to check
    btn.querySelector('svg')?.remove();
    btn.insertAdjacentHTML('afterbegin', iconSvg('check', 'icon small'));
    if (label) label.textContent = 'Copied!';
    clearTimeout(_copyTimer[codeId]);
    _copyTimer[codeId] = setTimeout(() => {
      btn.classList.remove('copied');
      btn.querySelector('svg')?.remove();
      btn.insertAdjacentHTML('afterbegin', iconSvg('copy', 'icon small'));
      if (label) label.textContent = orig;
    }, 2000);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(onSuccess).catch(() => fallbackCopy(text, onSuccess));
  } else {
    fallbackCopy(text, onSuccess);
  }
}
function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  Object.assign(ta.style, { position:'fixed', top:'0', left:'0', opacity:'0', pointerEvents:'none' });
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { if (document.execCommand('copy')) cb(); } catch {}
  document.body.removeChild(ta);
}

function renderText(text) {
  const src = text || '';
  const codeBlocks = [];
  // Extract fenced code blocks before HTML-escaping
  const withHoles = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const id = codeBlocks.length;
    codeBlocks.push({ lang: lang.trim(), code: code.trim() });
    return `\x00CODEBLOCK${id}\x00`;
  });

  // Process as segments so paragraphs don't wrap code blocks
  const segments = withHoles.split(/\x00CODEBLOCK(\d+)\x00/);
  return segments.map((seg, idx) => {
    if (idx % 2 === 1) {
      // This is a code block index
      const block = codeBlocks[parseInt(seg)];
      const lang = block.lang || '';
      const escapedCode = escapeHtml(block.code);
      const highlighted = syntaxHighlight(escapedCode, lang);
      const codeId = 'cb-' + Math.random().toString(36).slice(2, 9);
      return `<div class="code-block"><div class="code-header"><span class="code-lang">${lang || 'code'}</span><button class="copy-btn" onclick="copyCode(this,'${codeId}')">${iconSvg('copy','icon small')}<span>Copy</span></button></div><pre><code id="${codeId}">${highlighted}</code></pre></div>`;
    }
    // Regular text segment
    const escapedSeg = escapeHtml(seg);
    return escapedSeg
      .split(/\n{2,}/)
      .map(part => part.trim() ? `<p>${part.replace(/\n/g, '<br>').replace(/`([^`]+)`/g, '<code>$1</code>')}</p>` : '')
      .join('');
  }).join('');
}

function createThinkingStream(anchorNode) {
  const wrap = anchorNode.closest(".msg-content-wrap");
  if (!wrap) return null;

  const shell = document.createElement("div");
  shell.className = "thinking-stream";
  shell.setAttribute("aria-label", "Thinking");
  
  if (state.modelMode === "instant") {
    shell.innerHTML = `
      <div class="thinking-shell" style="opacity: 0.65;">
        <span class="thinking-dot"></span>
        <span style="font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: 0.02em;">Loading instant response...</span>
      </div>`;
  } else {
    shell.innerHTML = `
      <div class="thinking-shell">
        <span class="thinking-label-wrap">
          <span class="thinking-dot"></span>
          <span style="font-weight: 600; text-transform: uppercase; font-size: 10px; opacity: 0.6; letter-spacing: 0.05em;">Thinking:</span>
        </span>
        <div class="thinking-window" aria-live="polite"></div>
      </div>`;
  }
  wrap.insertBefore(shell, anchorNode);

  if (state.modelMode === "instant") {
    let closed = false;
    return {
      push() {},
      finish() {
        if (closed) return;
        closed = true;
        shell.classList.add("hide");
        setTimeout(() => shell.remove(), 220);
      }
    };
  }

  const windowEl = shell.querySelector(".thinking-window");
  let contentEl = null;
  if (windowEl) {
    contentEl = document.createElement("div");
    contentEl.className = "thinking-content";
    windowEl.appendChild(contentEl);
  }
  let closed = false;

  function push(value) {
    if (closed || !contentEl) return;
    const cleanText = cleanThinkingLine(value);
    if (!cleanText) return;

    contentEl.textContent = cleanText;
    
    // Auto-scroll within the window
    windowEl.scrollTop = windowEl.scrollHeight;
  }

  // Initial loading state
  push("Analyzing query...");

  return {
    push,
    finish() {
      if (closed) return;
      closed = true;
      shell.classList.add("hide");
      setTimeout(() => shell.remove(), 220);
    }
  };
}

async function sendMessage(preset = "") {
  if (state.busy) return;
  const text = (preset || els.chatInput.value).trim();
  if (!text && state.attachments.length === 0) return;

  const chat = activeChat();
  setBusy(true);
  
  // Cache active attachments and clear state
  const currentAttachments = [...state.attachments];
  state.attachments = [];
  els.attachmentPreviewContainer.innerHTML = "";

  els.chatInput.value = "";
  resizeInput();

  if (!chat.messages.length) els.messages.innerHTML = "";
  const msgObj = { role: "user", content: text };
  if (currentAttachments.length > 0) {
    msgObj.attachments = currentAttachments;
  }
  chat.messages.push(msgObj);
  chat.title = chat.title === "New chat" ? (text ? makeTitle(text) : "Attached Media") : chat.title;
  chat.updatedAt = Date.now();
  addMessageNode("user", text, "", currentAttachments);
  const assistantNode = addMessageNode("assistant", "", "pending");
  assistantNode.classList.add("typing");
  
  let searchPill = null;
  if (state.searchWeb) {
    const wrap = assistantNode.closest(".msg-content-wrap");
    if (wrap) {
      searchPill = document.createElement("div");
      searchPill.className = "search-status-pill";
      searchPill.innerHTML = `
        <svg class="icon small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right:4px;">${ICONS.globe}</svg>
        <span class="search-status-text">Searching the web...</span>
      `;
      wrap.insertBefore(searchPill, assistantNode);
    }
  }

  const thinkingStream = createThinkingStream(assistantNode);
  renderChatList();
  saveAll();
  scrollMessages();

  try {
    const activeMode = state.modelMode;
    const modeSystemPrompt = activeMode === "instant" ? INSTANT_MODE_SYSTEM_PROMPT : "";
    
    // Dynamically append or strip the '-thinking' suffix to trigger FastAPI reasoning engine
    let finalModelName = API.model;
    if (activeMode === "thinking") {
      if (!finalModelName.toLowerCase().includes("thinking")) {
        finalModelName = finalModelName + "-thinking";
      }
    } else {
      finalModelName = finalModelName.replace(/-thinking/gi, "").replace(/thinking/gi, "");
    }

    const payload = {
      model: finalModelName,
      mode: activeMode,
      modelMode: activeMode,
      enableThinking: activeMode === "thinking",
      showThinking: activeMode === "thinking",
      systemPrompt: modeSystemPrompt || undefined,
      searchWeb: state.searchWeb,
      conversationId: chat.id,
      messages: chat.messages.map(m => {
        const item = { role: m.role, content: m.content };
        if (m.attachments) item.attachments = m.attachments;
        return item;
      }),
      stream: true,
      account: state.user || null
    };

    const data = await postJson(API.chat, payload);
    let rawReply = "";
    let reply = "";
    let replyStarted = false;
    let lastThought = "";

    function renderAssistantFromRaw() {
      const split = splitThinkingBlocks(rawReply);
      const thoughtText = cleanThinkingLine(split.thoughts.join(" "));
      
      if (searchPill && (thoughtText || split.visible.trim())) {
        searchPill.style.animation = "none";
        searchPill.querySelector(".search-status-text").textContent = "Searched the web";
        searchPill.style.background = "rgba(16, 163, 127, 0.05)";
        searchPill.style.borderColor = "rgba(16, 163, 127, 0.1)";
        searchPill.style.color = "var(--text-muted)";
        searchPill.style.opacity = "0.7";
      }

      if (thoughtText && thoughtText !== lastThought && !replyStarted) {
        lastThought = thoughtText;
        thinkingStream?.push(thoughtText);
      }
      reply = split.visible;
      if (reply.trim() && !replyStarted) {
        replyStarted = true;
        thinkingStream?.finish();
      }
      assistantNode.innerHTML = renderText(reply);
      scrollMessages();
    }

    if (data instanceof Response) {
      assistantNode.innerHTML = "";
      await readSse(data, (chunk, thinking) => {
        const thoughtLine = cleanThinkingLine(thinking);
        if (thoughtLine && !replyStarted) {
          thinkingStream?.push(thoughtLine);
        }
        rawReply += chunk || "";
        renderAssistantFromRaw();
      });
    } else {
      const thoughtLine = cleanThinkingLine(extractThinking(data));
      if (thoughtLine) thinkingStream?.push(thoughtLine);
      rawReply = extractReply(data);
      renderAssistantFromRaw();
    }

    assistantNode.classList.remove("typing");
    thinkingStream?.finish();
    if (!reply.trim()) throw new Error("Empty response from API.");
    chat.messages.push({ role: "assistant", content: reply });
    chat.updatedAt = Date.now();
    saveAll();
  } catch (err) {
    assistantNode.classList.remove("typing");
    thinkingStream?.finish();
    assistantNode.textContent = `Error: ${err.message}`;
  } finally {
    setBusy(false);
    resizeInput();
    scrollMessages();
  }
}

function newChat() {
  const currentChat = activeChat();
  if (currentChat && currentChat.messages.length === 0) {
    // Current chat is already empty, just focus the input box
    setTimeout(() => els.chatInput.focus(), 20);
    return;
  }
  const chat = { id: uuid(), title: "New chat", messages: [], createdAt: Date.now(), updatedAt: Date.now() };
  state.chats.unshift(chat);
  state.activeChatId = chat.id;
  saveAll();
  renderChatList();
  renderMessages();
  closeSidebar();
  setTimeout(() => els.chatInput.focus(), 20);
}

function deleteChat(id) {
  state.chats = state.chats.filter(c => c.id !== id);
  if (!state.chats.length) {
    state.activeChatId = "";
    activeChat();
  } else if (state.activeChatId === id) {
    state.activeChatId = state.chats[0].id;
  }
  saveAll();
  renderChatList();
  renderMessages();
  
  if (state.token) {
    deleteChatFromServer(id);
  }
}

async function deleteChatFromServer(id) {
  if (!state.token) return;
  try {
    const headers = { "Authorization": `Bearer ${state.token}` };
    await fetch(endpoint(`${API.chats}/${id}`), { method: "DELETE", headers });
  } catch (err) {
    console.error("Failed to delete chat from user profile:", err);
  }
}

function clearError(el) {
  el.textContent = "";
  el.classList.remove("show");
}

function showError(el, message) {
  el.textContent = message;
  el.classList.add("show");
}

function switchAuth(mode) {
  const isLogin = mode === "login";
  els.loginTab.classList.toggle("active", isLogin);
  els.signupTab.classList.toggle("active", !isLogin);
  els.loginForm.classList.toggle("hidden", !isLogin);
  els.signupForm.classList.toggle("hidden", isLogin);
  clearError(els.loginError);
  clearError(els.signupError);
}

function openAuth(mode = "login") {
  switchAuth(mode);
  els.authModal.classList.remove("hidden");
  setTimeout(() => (mode === "login" ? $("loginEmail") : $("signupName")).focus(), 30);
}

function closeAuth() {
  els.authModal.classList.add("hidden");
}

function extractAuth(data, fallbackEmail) {
  return {
    token: data.token || data.accessToken || data.access_token || data.jwt || "",
    user: data.user || data.account || data.profile || { email: fallbackEmail, name: fallbackEmail.split("@")[0] }
  };
}

function finishAuth(auth) {
  state.token = auth.token || state.token;
  state.user = auth.user || state.user;
  storage.set("geo_token", state.token);
  storage.set("geo_user", state.user);
  setAccountUI();
  closeAuth();
  toast("Signed in");
  loadChatsFromServer();
}

async function login(event) {
  event.preventDefault();
  clearError(els.loginError);
  const btn = $("loginSubmit");
  btn.disabled = true;
  try {
    const email = $("loginEmail").value.trim();
    const password = $("loginPassword").value;
    const data = await postJson(API.login, { email, password });
    finishAuth(extractAuth(data, email));
  } catch (err) {
    showError(els.loginError, err.message);
  } finally {
    btn.disabled = false;
  }
}

async function signup(event) {
  event.preventDefault();
  clearError(els.signupError);
  const btn = $("signupSubmit");
  btn.disabled = true;
  try {
    const name = $("signupName").value.trim();
    const email = $("signupEmail").value.trim();
    const password = $("signupPassword").value;
    const data = await postJson(API.signup, { name, email, password });
    finishAuth(extractAuth(data, email));
  } catch (err) {
    showError(els.signupError, err.message);
  } finally {
    btn.disabled = false;
  }
}

async function logout() {
  try { await postJson(API.logout, {}); } catch {}
  state.token = "";
  state.user = null;
  state.chats = [];
  state.activeChatId = "";
  storage.remove("geo_token");
  storage.remove("geo_user");
  storage.remove("geo_chats_v4");
  storage.remove("geo_active_chat_id_v4");
  activeChat();
  setAccountUI();
  renderChatList();
  renderMessages();
  toast("Logged out");
}

function setAccountUI() {
  const signedIn = Boolean(state.user);
  const name = state.user?.name || state.user?.email || "Workspace";
  const sub = signedIn ? (state.user?.email || "Signed in") : "Cloud workspace";
  document.body.classList.toggle("signed-in", signedIn);
  els.accountName.textContent = name;
  els.accountSub.textContent = sub;
}

function applyTheme(theme) {
  state.theme = theme === "light" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", state.theme);
  storage.set("geo_theme", state.theme);
  const isLight = state.theme === "light";
  els.themeLabel.textContent = isLight ? "Dark Mode" : "Light Mode";
  const btn = $("themeBtn");
  btn.querySelector("svg")?.remove();
  btn.insertAdjacentHTML("afterbegin", iconSvg(isLight ? "moon" : "sun", "icon"));
}

function toggleTheme() {
  applyTheme(state.theme === "light" ? "dark" : "light");
}

function toast(message) {
  els.toast.textContent = message;
  els.toast.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => els.toast.classList.remove("show"), 1600);
}

function openSidebar() {
  els.sidebar.classList.add("open");
  els.sidebarShade.classList.add("show");
}

function closeSidebar() {
  els.sidebar.classList.remove("open");
  els.sidebarShade.classList.remove("show");
}

hydrateIcons();
selectModelMode(state.modelMode);
els.modeThinkingBtn.addEventListener("click", () => selectModelMode("thinking"));
els.modeInstantBtn.addEventListener("click", () => selectModelMode("instant"));
els.modelSelectBtn.addEventListener("click", toggleModelDropdown);
document.addEventListener("click", closeModelDropdown);
document.addEventListener("keydown", event => {
  if (event.key === "Escape") els.modelDropdown.classList.add("hidden");
});
$("newChatBtn").addEventListener("click", newChat);
$("menuBtn").addEventListener("click", openSidebar);
$("mobileAuthBtn").addEventListener("click", () => openAuth("login"));
els.sidebarShade.addEventListener("click", closeSidebar);
els.chatInput.addEventListener("input", resizeInput);
els.chatInput.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});
els.sendBtn.addEventListener("click", () => sendMessage());
els.sidebarAuthBtn.addEventListener("click", () => { openAuth("login"); closeSidebar(); });
$("accountBtn").addEventListener("click", () => { openAuth("login"); closeSidebar(); });
$("logoutBtn").addEventListener("click", logout);
$("authCloseBtn").addEventListener("click", closeAuth);
els.authModal.addEventListener("click", event => { if (event.target === els.authModal) closeAuth(); });
els.loginTab.addEventListener("click", () => switchAuth("login"));
els.signupTab.addEventListener("click", () => switchAuth("signup"));
els.loginForm.addEventListener("submit", login);
els.signupForm.addEventListener("submit", signup);
$("themeBtn").addEventListener("click", toggleTheme);
$("communityBtn").addEventListener("click", () => { window.location.href = "/community"; });
$("updatesBtn").addEventListener("click", () => { window.location.href = "/updates"; });
els.searchWebBtn.addEventListener("click", () => {
  state.searchWeb = !state.searchWeb;
  els.searchWebBtn.classList.toggle("active", state.searchWeb);
  toast(state.searchWeb ? "Web Search enabled" : "Web Search disabled");
});

function modelSupportsMultimodal(modelId) {
  if (!modelId) return false;
  const id = modelId.toLowerCase();
  if (id.includes("1b")) return false;
  if (id.includes("geocentric-local") || id.includes("geocentric-raw")) return false;
  // Enable attachments for Qwen, Gemma, Llama, and 4B/7B/14B/VL/vision models
  if (id.includes("gemma") || id.includes("qwen") || id.includes("4b") || id.includes("7b") || id.includes("14b") || id.includes("vision") || id.includes("vl") || id.includes("multimodal")) {
    return true;
  }
  return false;
}

function updateAttachBtnVisibility() {
  const supports = modelSupportsMultimodal(API.model);
  els.attachBtn.style.display = supports ? "grid" : "none";
  const composer = document.querySelector(".composer");
  if (composer) {
    composer.classList.toggle("attachments-enabled", supports);
  }
}

function formatModelName(modelId) {
  if (!modelId) return "";
  const idLower = modelId.toLowerCase();
  if (idLower === "geocentric-local") return "Geocentric Ultra";
  if (idLower === "geocentric-raw") return "Geocentric Core";
  if (idLower === "geocentric-local-thinking") return "Geocentric Ultra (Reasoning)";
  
  return modelId
    .replace(/[:-]/g, " ")
    .replace(/\b[a-z]/g, letter => letter.toUpperCase())
    .replace(/\bLatest\b/gi, "")
    .trim();
}

async function loadModelsAndInitSelector() {
  try {
    const res = await fetch(endpoint("/v1/models"));
    if (res.ok) {
      const data = await res.json();
      const models = data.data || [];
      
      // Filter out redundant thinking and cloud models
      const filteredModels = models.filter(m => !m.id.toLowerCase().includes("-thinking") && m.id.toLowerCase() !== "geocentric-cloud");
      
      els.modelDropdown.innerHTML = "";
      filteredModels.forEach(m => {
        const btn = document.createElement("button");
        btn.className = `model-opt ${m.id === API.model ? "active" : ""}`;
        
        let desc = "Advanced Intelligence Model";
        const idLower = m.id.toLowerCase();
        if (idLower.includes("gemma") || idLower.includes("qwen") || idLower.includes("4b") || idLower.includes("7b") || idLower.includes("14b") || idLower.includes("vision") || idLower.includes("vl") || idLower.includes("multimodal")) {
          desc = "Multimodal Vision & Language Model";
        } else if (idLower.includes("1b")) {
          desc = "Text Intelligence Model";
        }
        
        btn.innerHTML = `
          <strong>${formatModelName(m.id)}</strong>
          <span class="model-opt-desc">${desc}</span>
        `;
        
        btn.addEventListener("click", () => {
          selectModel(m.id);
          els.modelDropdown.classList.add("hidden");
        });
        
        els.modelDropdown.appendChild(btn);
      });
      
      // Update header button name
      if ((API.model === "geocentric-cloud" || !filteredModels.some(m => m.id === API.model)) && filteredModels.length > 0) {
        API.model = filteredModels[0].id;
      }
      const activeModel = filteredModels.find(m => m.id === API.model) || { id: API.model };
      els.modelSelectName.textContent = formatModelName(activeModel.id);
      updateAttachBtnVisibility();
    }
  } catch (err) {
    console.error("Failed to load models list:", err);
  }
}

function selectModel(modelId) {
  API.model = modelId;
  els.modelSelectName.textContent = formatModelName(modelId);
  
  // Update dropdown active class
  els.modelDropdown.querySelectorAll(".model-opt").forEach(btn => {
    const btnModel = btn.querySelector("strong").textContent;
    btn.classList.toggle("active", btnModel === modelId);
  });
  
  updateAttachBtnVisibility();
  toast(`Switched model to ${modelId}`);
}

function handleFileSelect(event) {
  const files = Array.from(event.target.files);
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      state.attachments.push(e.target.result);
      renderAttachmentPreviews();
    };
    reader.readAsDataURL(file);
  });
  event.target.value = ""; // Reset input so same file can be selected again
}

function renderAttachmentPreviews() {
  els.attachmentPreviewContainer.innerHTML = "";
  state.attachments.forEach((base64, index) => {
    const isVideo = base64.startsWith("data:video/") || base64.includes("video/mp4") || base64.includes("video/webm");
    const preview = document.createElement("div");
    preview.className = "preview-item";
    
    if (isVideo) {
      preview.innerHTML = `<video src="${base64}"></video>`;
    } else {
      preview.innerHTML = `<img src="${base64}" alt="preview" />`;
    }
    
    const removeBtn = document.createElement("button");
    removeBtn.className = "preview-item-remove";
    removeBtn.innerHTML = "&times;";
    removeBtn.addEventListener("click", () => removeAttachment(index));
    
    preview.appendChild(removeBtn);
    els.attachmentPreviewContainer.appendChild(preview);
  });
}

function removeAttachment(index) {
  state.attachments.splice(index, 1);
  renderAttachmentPreviews();
}

// Model dropdown toggle
els.modelSelectBtn.addEventListener("click", event => {
  event.stopPropagation();
  els.modelDropdown.classList.toggle("hidden");
});

document.addEventListener("click", event => {
  if (!event.target.closest(".model-select-container")) {
    els.modelDropdown.classList.add("hidden");
  }
});

// Attachment triggers
els.attachBtn.addEventListener("click", () => els.attachmentInput.click());
els.attachmentInput.addEventListener("change", handleFileSelect);

// Init models on start
loadModelsAndInitSelector();

function initVisualViewport() {
  if (!window.visualViewport) return;
  
  const updateViewport = () => {
    const vh = window.visualViewport.height;
    document.documentElement.style.setProperty('--viewport-height', `${vh}px`);
    window.scrollTo(0, 0);
  };

  window.visualViewport.addEventListener('resize', updateViewport);
  window.visualViewport.addEventListener('scroll', updateViewport);
  
  updateViewport();
  
  els.chatInput.addEventListener('focus', () => {
    setTimeout(updateViewport, 80);
  });
  els.chatInput.addEventListener('blur', () => {
    setTimeout(updateViewport, 80);
  });
}

initVisualViewport();
activeChat();
setAccountUI();
applyTheme(state.theme);
renderChatList();
renderMessages();
resizeInput();
storage.set("geo_active_chat_id_v4", state.activeChatId);
if (state.token) {
  loadChatsFromServer();
}
setTimeout(() => els.chatInput.focus(), 50);
</script>

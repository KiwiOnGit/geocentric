function updateAssistantProgress(node, text) {
  if (!node) return;
  node.innerHTML = `<p>${escapeHtml(text || "Working on your request...")}</p>`;
}

async function refreshChatFromServer(chatId) {
  if (!state.token || !chatId) return null;
  try {
    const data = await getJson(API.chats);
    const serverChats = (data.chats || []).filter(hasMessages);
    const found = serverChats.find(c => c.id === chatId);
    const knownIds = new Set(serverChats.map(c => c.id));
    const localOnly = state.chats.filter(c => !knownIds.has(c.id));
    state.chats = [...serverChats, ...localOnly]
      .filter((chat, index, list) => list.findIndex(item => item.id === chat.id) === index)
      .sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
    storage.set("geo_chats_v4", state.chats.filter(hasMessages).slice(0, 100));
    renderChatList();
    return found || null;
  } catch (err) {
    console.error("Failed to refresh chat:", err);
    return null;
  }
}

function finishJobInUi(job, assistantNode = null) {
  delete state.activeJobs[job.id];
  saveActiveJobs();
  const chat = state.chats.find(c => c.id === job.chatId);
  if (job.status === "completed") {
    if (chat && job.reply && !chat.messages.some(m => m.role === "assistant" && m.content === job.reply)) {
      chat.messages.push({ role: "assistant", content: job.reply });
      chat.updatedAt = Date.now();
      storage.set("geo_chats_v4", state.chats.filter(hasMessages).slice(0, 100));
    }
    if (assistantNode) {
      assistantNode.classList.remove("typing");
      assistantNode.innerHTML = renderText(job.reply || "");
    }
    refreshChatFromServer(job.chatId).then(serverChat => {
      if (serverChat && state.activeChatId === job.chatId) renderMessages();
    });
    loadRoadmapForChat(job.chatId, true);
  } else if (job.status === "failed") {
    const message = `Error: ${job.error || "Agent job failed."}`;
    if (assistantNode) {
      assistantNode.classList.remove("typing");
      assistantNode.textContent = message;
    }
    if (chat) {
      chat.messages.push({ role: "assistant", content: message });
      chat.updatedAt = Date.now();
      saveAll();
    }
  }
  renderChatList();
}

async function pollAgentJob(jobId, assistantNode = null) {
  if (!state.token || !jobId) return;
  if (state.pollingJobs[jobId]) {
    clearTimeout(state.pollingJobs[jobId]);
    delete state.pollingJobs[jobId];
  }
  try {
    const data = await getJson(`${API.chatJobs}/${jobId}`);
    const job = data.job;
    if (!job) return;
    const roadmapChanged = applyJobRoadmap(job);
    state.activeJobs[job.id] = { chatId: job.chatId, progress: job.progress, status: job.status };
    saveActiveJobs();
    if (assistantNode && (job.status === "queued" || job.status === "running")) {
      updateAssistantProgress(assistantNode, job.progress);
      if (roadmapChanged && state.activeChatId === job.chatId) {
        renderMessages();
        state.pollingJobs[jobId] = setTimeout(() => pollAgentJob(jobId), 1400);
      } else {
        state.pollingJobs[jobId] = setTimeout(() => pollAgentJob(jobId, assistantNode), 1400);
      }
    } else if (job.status === "queued" || job.status === "running") {
      renderChatList();
      if (roadmapChanged || !activeChat(false)?.messages?.length) renderMessages();
      state.pollingJobs[jobId] = setTimeout(() => pollAgentJob(jobId), 2500);
    } else {
      clearTimeout(state.pollingJobs[jobId]);
      delete state.pollingJobs[jobId];
      finishJobInUi(job, assistantNode);
    }
  } catch (err) {
    if (assistantNode) assistantNode.textContent = `Error: ${err.message}`;
  }
}

async function resumeAgentJobs() {
  if (!state.token) return;
  state.activeJobs = normalizeJobs(state.activeJobs);
  try {
    const data = await getJson(API.chatJobs);
    (data.jobs || []).forEach(job => {
      if (job.status === "queued" || job.status === "running") {
        state.activeJobs[job.id] = { chatId: job.chatId, progress: job.progress, status: job.status };
        if (!state.pollingJobs[job.id]) pollAgentJob(job.id);
      } else if (state.activeJobs[job.id]) {
        finishJobInUi(job);
      }
    });
    saveActiveJobs();
    renderChatList();
    if (!activeChat(false)?.messages?.length) renderMessages();
  } catch (err) {
    console.error("Failed to resume agent jobs:", err);
  }
}

async function sendMessage(preset = "") {
  if (state.busy) return;
  const text = (preset || els.chatInput.value).trim();
  if (!text && state.attachments.length === 0) return;

  let chat = activeChat(false);
  if (!chat) {
    chat = createChat();
  }
  setBusy(true);
  storage.set("geo_generating_chat_id", chat.id);

  // Cache active attachments and clear state
  const currentAttachments = [...state.attachments];
  state.attachments = [];
  els.attachmentPreviewContainer.innerHTML = "";

  els.chatInput.value = "";
  resizeInput();

  if (!chat.messages.length) els.messages.innerHTML = "";

  // Check if we are resuming (preset is set) and last message is already user text
  const lastMsg = chat.messages[chat.messages.length - 1];
  const isResuming = preset && lastMsg && lastMsg.role === "user" && lastMsg.content === preset;

  if (!isResuming) {
    const msgObj = { role: "user", content: text };
    if (currentAttachments.length > 0) {
      msgObj.attachments = currentAttachments;
    }
    chat.messages.push(msgObj);
    if (shouldReplaceChatTitle(chat)) {
      chat.title = text ? makeTitle(text) : "Attached Files";
      chat.titleSource = "auto";
    }
    chat.updatedAt = Date.now();
    addMessageNode("user", text, "", currentAttachments);
  }

  const assistantNode = addMessageNode("assistant", "", "pending");
  assistantNode.classList.add("typing");
  const useAgentJob = Boolean(state.token && shouldUseAgentJob(text, currentAttachments));

  let searchPill = null;
  if (state.searchWeb && !useAgentJob) {
    const wrap = assistantNode.closest(".msg-content-wrap");
    if (wrap) {
      searchPill = document.createElement("div");
      searchPill.className = "glowing-status-bar";
      searchPill.innerHTML = `
        <span class="status-spinner"></span>
        <span class="search-status-text">Searching the web...</span>
      `;
      wrap.insertBefore(searchPill, assistantNode);
    }
  }

  const thinkingStream = createThinkingStream(assistantNode);
  renderChatList();
  saveAll();
  scrollMessages();

  try {
    const activeMode = state.modelMode;
    const modeSystemPrompt = activeMode === "instant" ? INSTANT_MODE_SYSTEM_PROMPT : "";

    let finalModelName = API.model;
    if (activeMode === "thinking") {
      if (!finalModelName.toLowerCase().includes("thinking")) {
        finalModelName = finalModelName + "-thinking";
      }
    } else {
      finalModelName = finalModelName.replace(/-thinking/gi, "").replace(/thinking/gi, "");
    }

    const payload = {
      model: finalModelName,
      mode: activeMode,
      modelMode: activeMode,
      enableThinking: activeMode === "thinking",
      showThinking: activeMode === "thinking",
      systemPrompt: modeSystemPrompt || undefined,
      searchWeb: state.searchWeb,
      conversationId: chat.id,
      messages: chat.messages.map(m => {
        const item = { role: m.role, content: m.content };
        if (m.attachments) item.attachments = m.attachments;
        return item;
      }),
      stream: true,
      account: state.user || null,
      agentMode: false
    };

    payload.agentMode = useAgentJob;

    if (useAgentJob) {
      updateAssistantProgress(assistantNode, "Preparing workspace and agent tools...");
      const jobData = await postJson(API.chatJobs, { ...payload, stream: false });
      state.activeJobs[jobData.jobId] = {
        chatId: jobData.chatId,
        status: jobData.status,
        progress: jobData.progress
      };
      const roadmapChanged = applyJobRoadmap({ chatId: jobData.chatId, roadmap: jobData.roadmap || "" });
      saveActiveJobs();
      updateAssistantProgress(assistantNode, jobData.progress);
      thinkingStream?.finish();
      storage.remove("geo_generating_chat_id");
      setBusy(false);
      if (roadmapChanged && state.activeChatId === jobData.chatId) {
        renderMessages();
        pollAgentJob(jobData.jobId);
      } else {
        pollAgentJob(jobData.jobId, assistantNode);
      }
      return;
    }

    activeAbortController = new AbortController();
    const data = await postJson(API.chat, payload, activeAbortController.signal);
    let rawReply = "";
    let reply = "";
    let replyStarted = false;
    let lastThought = "";

    function renderAssistantFromRaw() {
      // 1. Extract status activity checklist
      const activities = parseActivities(rawReply);
      // 2. Strip internal XML tags for visual chat rendering
      const cleanRawReply = stripInternalTagsJS(rawReply);

      const split = splitThinkingBlocks(cleanRawReply);
      const thoughtText = cleanThinkingLine(split.thoughts.join(" "));

      // Update activities checklist component to show only the single active/latest step
      const activitiesDiv = assistantNode.closest(".msg-content-wrap")?.querySelector(".msg-activities");
      if (activitiesDiv) {
        const latestActivity = activities[activities.length - 1];
        if (state.busy && latestActivity && !latestActivity.done) {
          activitiesDiv.style.display = "flex";
          activitiesDiv.innerHTML = `
            <div class="glowing-status-bar">
              <span class="status-spinner"></span>
              <span>${escapeHtml(latestActivity.label)}...</span>
            </div>
          `;
        } else {
          activitiesDiv.style.display = "none";
        }
      }

      if (searchPill && (thoughtText || split.visible.trim())) {
        searchPill.style.display = "none";
      }

      if (thoughtText && thoughtText !== lastThought && !replyStarted) {
        lastThought = thoughtText;
        thinkingStream?.push(thoughtText);
      }
      reply = split.visible;
      if (reply.trim() && !replyStarted) {
        replyStarted = true;
        thinkingStream?.finish();
      }
      assistantNode.innerHTML = renderText(reply);
      scrollMessages();
    }

    if (data instanceof Response) {
      assistantNode.innerHTML = "";
      await readSse(data, (chunk, thinking) => {
        const thoughtLine = cleanThinkingLine(thinking);
        if (thoughtLine && !replyStarted) {
          thinkingStream?.push(thoughtLine);
        }
        rawReply += chunk || "";
        renderAssistantFromRaw();
      });
    } else {
      const thoughtLine = cleanThinkingLine(extractThinking(data));
      if (thoughtLine) thinkingStream?.push(thoughtLine);
      rawReply = extractReply(data);
      renderAssistantFromRaw();
    }

    assistantNode.classList.remove("typing");
    thinkingStream?.finish();
    if (!reply.trim()) throw new Error("Empty response from API.");
    chat.messages.push({ role: "assistant", content: reply });
    if (shouldReplaceChatTitle(chat)) {
      chat.title = extractChatTitleTag(rawReply) || chatAutoTitle(chat);
      chat.titleSource = "auto";
      renderChatList();
    }
    chat.updatedAt = Date.now();
    saveAll();

    // Automatically append ZIP download card if model created/edited files
    const hasCreatedFiles = rawReply.includes("<write_file") || rawReply.includes("<edit_file");
    if (hasCreatedFiles) {
      const msgContentWrap = assistantNode.closest(".msg-content-wrap");
      if (msgContentWrap) {
        let downloadCard = msgContentWrap.querySelector(".zip-download-card");
        if (!downloadCard) {
          downloadCard = document.createElement("div");
          downloadCard.className = "zip-download-card";
          downloadCard.innerHTML = `
            <div class="cron-job-meta">
              <span style="font-weight:700; color:var(--text); font-size:13.5px;">Project Workspace Ready</span>
              <span style="color:var(--faint); font-size:11.5px; margin-bottom:4px;">All files have been successfully created. Download the full project as a ZIP archive.</span>
            </div>
            <a href="/api/workspaces/${chat.id}/zip" class="zip-download-btn" download="project.zip" data-internal-download="true">
              <svg class="icon small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS.globe}</svg>
              <span>Download Project (ZIP)</span>
            </a>
          `;
          msgContentWrap.appendChild(downloadCard);
          hydrateIcons(downloadCard);
        }
      }
    }
  } catch (err) {
    assistantNode.classList.remove("typing");
    thinkingStream?.finish();
    if (err.name === "AbortError") {
      assistantNode.textContent = assistantNode.textContent || "Response generation stopped by user.";
    } else {
      assistantNode.textContent = `Error: ${err.message}`;
    }
  } finally {
    storage.remove("geo_generating_chat_id");
    setBusy(false);
    resizeInput();
    scrollMessages();
  }
}

function newChat(focus = true) {
  state.activeChatId = "";
  storage.set("geo_active_chat_id_v4", "");
  renderChatList();
  renderMessages();
  closeSidebar();
  if (focus) setTimeout(() => els.chatInput.focus(), 20);
}

function deleteChat(id) {
  state.chats = state.chats.filter(c => c.id !== id && hasMessages(c));
  if (!state.chats.length) {
    state.activeChatId = "";
  } else if (state.activeChatId === id) {
    state.activeChatId = state.chats[0].id;
  }
  saveAll();
  renderChatList();
  renderMessages();

  if (state.token) {
    deleteChatFromServer(id);
  }
}

async function deleteChatFromServer(id) {
  if (!state.token) return;
  try {
    const headers = { "Authorization": `Bearer ${state.token}` };
    await fetch(endpoint(`${API.chats}/${id}`), { method: "DELETE", headers });
  } catch (err) {
    console.error("Failed to delete chat from user profile:", err);
  }
}

function clearError(el) {
  el.textContent = "";
  el.classList.remove("show");
}

function showError(el, message) {
  el.textContent = message;
  el.classList.add("show");
}

function switchAuth(mode) {
  const isLogin = mode === "login";
  els.loginTab.classList.toggle("active", isLogin);
  els.signupTab.classList.toggle("active", !isLogin);
  els.loginForm.classList.toggle("hidden", !isLogin);
  els.signupForm.classList.toggle("hidden", isLogin);
  clearError(els.loginError);
  clearError(els.signupError);
}

function openAuth(mode = "login") {
  switchAuth(mode);
  els.authModal.classList.remove("hidden");
  setTimeout(() => (mode === "login" ? $("loginEmail") : $("signupName")).focus(), 30);
}

function closeAuth() {
  els.authModal.classList.add("hidden");
}

function extractAuth(data, fallbackEmail) {
  return {
    token: data.token || data.accessToken || data.access_token || data.jwt || "",
    user: data.user || data.account || data.profile || { email: fallbackEmail, name: fallbackEmail.split("@")[0] }
  };
}

function finishAuth(auth) {
  state.token = auth.token || state.token;
  state.user = auth.user || state.user;
  storage.set("geo_token", state.token);
  storage.set("geo_user", state.user);
  setAccountUI();
  closeAuth();
  toast("Signed in");
  loadChatsFromServer().then(resumeAgentJobs);
}

async function login(event) {
  event.preventDefault();
  clearError(els.loginError);
  const btn = $("loginSubmit");
  btn.disabled = true;
  try {
    const email = $("loginEmail").value.trim();
    const password = $("loginPassword").value;
    const data = await postJson(API.login, { email, password });
    finishAuth(extractAuth(data, email));
  } catch (err) {
    showError(els.loginError, err.message);
  } finally {
    btn.disabled = false;
  }
}

async function signup(event) {
  event.preventDefault();
  clearError(els.signupError);
  const btn = $("signupSubmit");
  btn.disabled = true;
  try {
    const name = $("signupName").value.trim();
    const email = $("signupEmail").value.trim();
    const password = $("signupPassword").value;
    const data = await postJson(API.signup, { name, email, password });
    finishAuth(extractAuth(data, email));
  } catch (err) {
    showError(els.signupError, err.message);
  } finally {
    btn.disabled = false;
  }
}

async function logout() {
  try { await postJson(API.logout, {}); } catch {}
  state.token = "";
  state.user = null;
  state.chats = [];
  state.activeChatId = "";
  state.activeJobs = {};
  state.roadmaps = {};
  storage.remove("geo_token");
  storage.remove("geo_user");
  storage.remove("geo_chats_v4");
  storage.remove("geo_active_chat_id_v4");
  storage.remove("geo_active_jobs_v1");
  storage.remove("geo_roadmaps_v1");
  activeChat();
  setAccountUI();
  renderChatList();
  renderMessages();
  toast("Logged out");
}

function setAccountUI() {

  const btn = $("themeBtn");
  btn.querySelector("svg")?.remove();
  btn.insertAdjacentHTML("afterbegin", iconSvg(isLight ? "moon" : "sun", "icon"));
}

function toggleTheme() {

$("cronForm")?.addEventListener("submit", async event => {
  event.preventDefault();
  const name = $("cronName").value.trim();
  let interval_hours = parseInt($("cronHours").value) || 0;
  let interval_minutes = parseInt($("cronMinutes").value) || 0;
  const prompt = $("cronPrompt").value.trim();
  const model = state.cronModel || API.model || "geocentric-local";

  if (interval_hours === 0 && interval_minutes === 0) {
    interval_minutes = 1;
    $("cronMinutes").value = "1";
  }

  try {
    const res = await fetch(endpoint("/api/cron-jobs"), {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        ...(state.token ? { "Authorization": `Bearer ${state.token}` } : {})
      },
      body: JSON.stringify({ name, prompt, interval_minutes, interval_hours, model })
    });

    if (!res.ok) {
      const errData = await res.json();
      throw new Error(errData.detail || "Failed to create cron job.");
    }

    toast("Cron job created successfully!");
    $("cronName").value = "";
    $("cronHours").value = "0";
    $("cronMinutes").value = "5";
    $("cronPrompt").value = "";
    loadCronJobs();
  } catch (err) {
    toast(`Error: ${err.message}`);
  }
});

// Auto-Resume ongoing generations cut off by page reload
const genChatId = storage.get("geo_generating_chat_id");
if (genChatId && state.chats.some(c => c.id === genChatId)) {
  const chat = state.chats.find(c => c.id === genChatId);
  if (chat && chat.messages.length > 0) {
    state.activeChatId = genChatId;
    saveAll();

    const lastMsg = chat.messages[chat.messages.length - 1];
    let resumeText = "";

    if (lastMsg.role === "user") {
      resumeText = lastMsg.content;
      chat.messages.pop();
      saveAll();
    } else if (lastMsg.role === "assistant") {
      chat.messages.pop();
      const userMsg = chat.messages.pop();
      if (userMsg && userMsg.role === "user") {
        resumeText = userMsg.content;
        saveAll();
      }
    }

    if (resumeText) {
      setTimeout(() => {
        renderChatList();
        renderMessages();
        sendMessage(resumeText);
      }, 600);
    }
  }
}

function modelSupportsMultimodal(modelId) {
  if (!modelId) return false;
  const id = modelId.toLowerCase();
  if (id.includes("1b")) return false;
  if (id.includes("geocentric-local") || id.includes("geocentric-raw")) return false;
  // Enable attachments for Qwen, Gemma, Llama, and 4B/7B/14B/VL/vision models
  if (id.includes("gemma") || id.includes("qwen") || id.includes("4b") || id.includes("7b") || id.includes("14b") || id.includes("vision") || id.includes("vl") || id.includes("multimodal")) {
    return true;
  }
  return false;
}

function updateAttachBtnVisibility() {
  const supports = true;
  els.attachBtn.style.display = supports ? "grid" : "none";
  const composer = document.querySelector(".composer");
  if (composer) {
    composer.classList.toggle("attachments-enabled", supports);
  }
}

function formatModelName(modelId) {
  if (!modelId) return "";
  const idLower = modelId.toLowerCase();
  if (idLower === "geocentric-local") return "Geocentric Ultra";
  if (idLower === "geocentric-raw") return "Geocentric Core";
  if (idLower === "geocentric-local-thinking") return "Geocentric Ultra (Reasoning)";

  return modelId
    .replace(/[:-]/g, " ")
    .replace(/\b[a-z]/g, letter => letter.toUpperCase())
    .replace(/\bLatest\b/gi, "")
    .trim();
}

function modelDescription(modelId) {
  const idLower = String(modelId || "").toLowerCase();
  if (idLower.includes("gemma") || idLower.includes("qwen") || idLower.includes("4b") || idLower.includes("7b") || idLower.includes("14b") || idLower.includes("vision") || idLower.includes("vl") || idLower.includes("multimodal")) {
    return "Multimodal Vision & Language Model";
  }
  if (idLower.includes("1b")) return "Text Intelligence Model";
  return "Advanced Intelligence Model";
}

function renderCronModelDropdown(models = state.availableModels) {
  if (!els.cronModelDropdown) return;
  const list = models.length ? models : [{ id: state.cronModel || API.model || "geocentric-local" }];
  els.cronModelDropdown.innerHTML = "";
  list.forEach(m => {
    const modelId = m.id || m;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = `model-opt ${modelId === state.cronModel ? "active" : ""}`;
    btn.dataset.model = modelId;
    btn.innerHTML = `
      ${iconSvg("sparkles", "icon small")}
      <span class="model-opt-main">
        <strong>${formatModelName(modelId)}</strong>
        <span class="model-opt-desc">${modelDescription(modelId)}</span>
      </span>
    `;
    btn.addEventListener("click", () => selectCronModel(modelId));
    els.cronModelDropdown.appendChild(btn);
  });
  if (els.cronModelName) els.cronModelName.textContent = formatModelName(state.cronModel);
}

function selectCronModel(modelId, notify = true) {
  state.cronModel = modelId || API.model || "geocentric-local";
  storage.set("geo_cron_model", state.cronModel);
  if (els.cronModelName) els.cronModelName.textContent = formatModelName(state.cronModel);
  els.cronModelDropdown?.querySelectorAll(".model-opt").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.model === state.cronModel);
  });
  els.cronModelDropdown?.classList.add("hidden");
  els.cronModelBtn?.setAttribute("aria-expanded", "false");
  if (notify) toast(`Cron model set to ${state.cronModel}`);
}

function toggleCronModelDropdown(event) {
  event?.stopPropagation?.();
  renderCronModelDropdown();
  const isHidden = els.cronModelDropdown?.classList.contains("hidden");
  els.cronModelDropdown?.classList.toggle("hidden", !isHidden);
  els.cronModelBtn?.setAttribute("aria-expanded", String(isHidden));
}

async function loadModelsAndInitSelector() {
  if (!els.modelDropdown) {
    renderCronModelDropdown();
    updateAttachBtnVisibility();
    return;
  }

  try {
    const res = await fetch(endpoint("/v1/models"));
    if (res.ok) {
      const data = await res.json();
      const models = data.data || [];

      // Filter out redundant thinking and cloud models
      const filteredModels = models.filter(m => !m.id.toLowerCase().includes("-thinking") && m.id.toLowerCase() !== "geocentric-cloud");
      state.availableModels = filteredModels;

      els.modelDropdown.innerHTML = "";
      filteredModels.forEach(m => {
        const btn = document.createElement("button");
        btn.className = `model-opt ${m.id === API.model ? "active" : ""}`;
        btn.dataset.model = m.id;

        btn.innerHTML = `
          ${iconSvg("sparkles", "icon small")}
          <span class="model-opt-main">
            <strong>${formatModelName(m.id)}</strong>
            <span class="model-opt-desc">${modelDescription(m.id)}</span>
          </span>
        `;

        btn.addEventListener("click", () => {
          selectModel(m.id);
          closeModelDropdown();
        });

        els.modelDropdown.appendChild(btn);
      });

      // Update header button name
      if ((API.model === "geocentric-cloud" || !filteredModels.some(m => m.id === API.model)) && filteredModels.length > 0) {
        API.model = filteredModels[0].id;
      }
      const activeModel = filteredModels.find(m => m.id === API.model) || { id: API.model };
      if (els.modelSelectName) els.modelSelectName.textContent = formatModelName(activeModel.id);
      if (!filteredModels.some(m => m.id === state.cronModel) && filteredModels.length > 0) {
        state.cronModel = API.model || filteredModels[0].id;
        storage.set("geo_cron_model", state.cronModel);
      }
      renderCronModelDropdown(filteredModels);
      updateAttachBtnVisibility();
    }
  } catch (err) {
    console.error("Failed to load models list:", err);
    renderCronModelDropdown();
  }
}

function selectModel(modelId) {
  API.model = modelId;
  if (els.modelSelectName) els.modelSelectName.textContent = formatModelName(modelId);

  // Update dropdown active class
  els.modelDropdown?.querySelectorAll(".model-opt").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.model === modelId);
  });

  updateAttachBtnVisibility();
  toast(`Switched model to ${modelId}`);
}

function handleFileSelect(event) {
  const files = Array.from(event.target.files);
  files.forEach(file => {
    if (file.size > 75 * 1024 * 1024) {
      toast(`${file.name} is too large. Max upload size is 75 MB.`);
      return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      state.attachments.push({
        name: file.name,
        type: file.type || "application/octet-stream",
        size: file.size,
        dataUrl: e.target.result
      });
      renderAttachmentPreviews();
    };
    reader.readAsDataURL(file);
  });
  event.target.value = ""; // Reset input so same file can be selected again
}

function attachmentExt(name, type = "") {
  const ext = String(name || "").split(".").pop();
  if (ext && ext !== name) return ext.slice(0, 6);
  if (type.startsWith("text/")) return "txt";
  if (type.includes("zip")) return "zip";
  if (type.includes("json")) return "json";
  return "file";
}

function renderAttachmentPreviews() {
  els.attachmentPreviewContainer.innerHTML = "";
  state.attachments.forEach((attachment, index) => {
    const dataUrl = typeof attachment === "string" ? attachment : attachment.dataUrl;
    const name = typeof attachment === "string" ? "attachment" : (attachment.name || "attachment");
    const type = typeof attachment === "string" ? "" : (attachment.type || "");
    const isImage = dataUrl && (dataUrl.startsWith("data:image/") || type.startsWith("image/"));
    const isVideo = dataUrl && (dataUrl.startsWith("data:video/") || type.startsWith("video/") || dataUrl.includes("video/mp4") || dataUrl.includes("video/webm"));
    const preview = document.createElement("div");
    preview.className = "preview-item";
    preview.title = name;

    if (isVideo) {
      preview.innerHTML = `<video src="${dataUrl}"></video>`;
    } else if (isImage) {
      preview.innerHTML = `<img src="${dataUrl}" alt="${escapeHtml(name)}" />`;
    } else {
      preview.innerHTML = `
        <div class="preview-file">
          <span class="preview-file-ext">${escapeHtml(attachmentExt(name, type))}</span>
          <span class="preview-file-name">${escapeHtml(name)}</span>
        </div>`;
    }

    const removeBtn = document.createElement("button");
    removeBtn.className = "preview-item-remove";
    removeBtn.innerHTML = "&times;";
    removeBtn.addEventListener("click", () => removeAttachment(index));

    preview.appendChild(removeBtn);
    els.attachmentPreviewContainer.appendChild(preview);
  });
}

function removeAttachment(index) {
  state.attachments.splice(index, 1);
  renderAttachmentPreviews();
}

// Model dropdown toggle
if (els.modelSelectBtn && els.modelDropdown) {
  els.modelSelectBtn.addEventListener("click", toggleModelDropdown);
}
document.addEventListener("click", closeHeaderDropdowns);

function initVisualViewport() {
  const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  if (isMobile) {
    document.documentElement.classList.add("mobile-device");
  } else {
    document.documentElement.classList.add("desktop-device");
  }

  const updateViewport = () => {
    const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    const minHeight = isMobile ? 320 : 1;
    document.documentElement.style.setProperty('--viewport-height', `${Math.max(minHeight, viewportHeight)}px`);
  };

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateViewport, { passive: true });
  }
  window.addEventListener('resize', updateViewport, { passive: true });

  updateViewport();

  els.chatInput.addEventListener('focus', () => setTimeout(updateViewport, 80));
  els.chatInput.addEventListener('blur', () => setTimeout(updateViewport, 80));
}

} else if (msg === "updates_coming_soon") {

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Geocentric</title>
<meta name="description" content="Geocentric AI chat" />
<meta name="theme-color" content="#343541" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Geocentric" />
<link rel="icon" href="appicon.png" />
<link rel="apple-touch-icon" href="appicon.png" />
<style>
:root {
  color-scheme: dark;
  --sidebar: #202123;
  --main: #343541;
  --main-soft: #3b3c49;
  --panel: #3e3f4d;
  --panel-hover: #464756;
  --assistant-row: #444654;
  --line: rgba(255,255,255,.13);
  --line-soft: rgba(255,255,255,.075);
  --text: #f7f7f8;
  --muted: #d1d5db;
  --faint: #9ca3af;
  --subtle: #8e8ea0;
  --accent: #10a37f;
  --danger: #ef4444;
  --sidebar-w: 272px;
  --radius: 6px;
  --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --shadow: 0 22px 80px rgba(0,0,0,.38);
  /* Syntax highlight */
  --hl-comment: #8b949e;
  --hl-string: #a5d6a7;
  --hl-number: #79c0ff;
  --hl-keyword: #ff7b72;
  --hl-function: #d2a8ff;
  --hl-boolean: #ffa657;
  --hl-property: #79c0ff;
  --hl-tag: #7ee787;
  --hl-attr: #ffa657;
}

html[data-theme="light"] {
  color-scheme: light;
  --sidebar: #f7f7f8;
  --main: #ffffff;
  --main-soft: #f3f4f6;
  --panel: #f7f7f8;
  --panel-hover: #ececf1;
  --assistant-row: #f7f7f8;
  --line: rgba(0,0,0,.14);
  --line-soft: rgba(0,0,0,.08);
  --text: #202123;
  --muted: #374151;
  --faint: #6b7280;
  --subtle: #8e8ea0;
}

* { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}
body {
  font-family: var(--font);
  background: var(--main);
  color: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  height: var(--viewport-height, 100%);
}
button, input, textarea { font: inherit; }
button { cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.icon { width: 18px; height: 18px; stroke-width: 2; flex: 0 0 auto; }
.icon.small { width: 15px; height: 15px; }
.icon.large { width: 26px; height: 26px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  background: var(--main);
  overflow: hidden;
}

.sidebar {
  min-width: 0;
  background: var(--sidebar);
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--line-soft);
  padding: 10px;
}

.new-chat {
  width: 100%;
  height: 50px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: transparent;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 14px;
  text-align: left;
  font-size: 15px;
  font-weight: 600;
  transition: background .15s ease, border-color .15s ease;
}
.new-chat:hover { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.24); }
html[data-theme="light"] .new-chat:hover { background: rgba(0,0,0,.045); }

.sidebar-title {
  margin: 18px 8px 8px;
  color: var(--subtle);
  font-size: 12px;
  font-weight: 600;
}
.chat-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-right: 2px;
}
.chat-list::-webkit-scrollbar { width: 5px; }
.chat-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.17); border-radius: 999px; }
html[data-theme="light"] .chat-list::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); }

.chat-item {
  min-height: 42px;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: var(--muted);
  display: grid;
  grid-template-columns: 18px 1fr 28px;
  align-items: center;
  gap: 9px;
  padding: 0 6px 0 10px;
  text-align: left;
}
.chat-item:hover, .chat-item.active { background: rgba(255,255,255,.075); color: var(--text); }
html[data-theme="light"] .chat-item:hover, html[data-theme="light"] .chat-item.active { background: rgba(0,0,0,.06); }
.chat-item-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.chat-delete {
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--faint);
  opacity: 0;
  display: grid;
  place-items: center;
}
.chat-item:hover .chat-delete { opacity: 1; }
.chat-delete:hover { color: #fecaca; background: rgba(239,68,68,.14); }

.sidebar-bottom {
  border-top: 1px solid var(--line);
  padding-top: 10px;
  display: grid;
  gap: 4px;
}
.side-btn, .account-chip {
  width: 100%;
  min-height: 44px;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px;
  text-align: left;
  text-decoration: none;
}
.side-btn:hover, .account-chip:hover { background: rgba(255,255,255,.075); }
html[data-theme="light"] .side-btn:hover, html[data-theme="light"] .account-chip:hover { background: rgba(0,0,0,.06); }
.account-chip { display: flex; }
.account-avatar {
  width: 28px;
  height: 28px;
  border-radius: 4px;
  object-fit: cover;
  background: var(--panel);
  border: 1px solid var(--line-soft);
}
.account-text { min-width: 0; display: grid; gap: 1px; }
.account-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.account-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--faint); }
#logoutBtn { display: none; }
body.signed-in #logoutBtn { display: flex; }
body.signed-in #sidebarAuthBtn { display: none; }

.main {
  min-width: 0;
  height: 100%;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  position: relative;
  overflow: hidden;
}
.mobile-topbar { display: none; }

.messages-wrap {
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--main);
}
.messages-wrap::-webkit-scrollbar { width: 8px; }
.messages-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 999px; }
html[data-theme="light"] .messages-wrap::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); }
.messages { min-height: 100%; padding-bottom: 64px; }

.empty-state {
  min-height: 100%;
  display: grid;
  place-items: center;
  padding: 44px 24px 128px;
}
.empty-inner {
  width: min(900px, 100%);
  text-align: center;
}
.empty-title {
  margin: 0 0 62px;
  font-size: clamp(34px, 4.6vw, 44px);
  line-height: 1;
  letter-spacing: -.055em;
  font-weight: 700;
}
.home-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  max-width: 900px;
  margin: 0 auto;
}
.home-col { display: grid; gap: 13px; align-content: start; }
.home-head {
  display: grid;
  place-items: center;
  gap: 12px;
  margin-bottom: 6px;
  color: var(--text);
  font-size: 18px;
  font-weight: 500;
}
.home-card {
  min-height: 72px;
  border: 0;
  border-radius: 7px;
  background: var(--panel);
  color: var(--text);
  padding: 14px 16px;
  display: grid;
  place-items: center;
  text-align: center;
  font-size: 14px;
  line-height: 1.45;
  white-space: normal;
}
button.home-card:hover { background: var(--panel-hover); }
.home-card.muted { cursor: default; }
.active-jobs {
  max-width: 900px;
  margin: 0 auto 22px;
  display: grid;
  gap: 8px;
}
.active-job-card {
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--panel);
  color: var(--text);
  min-height: 54px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  text-align: left;
}
.active-job-main {
  min-width: 0;
  display: grid;
  gap: 2px;
}
.active-job-title {
  font-size: 13px;
  font-weight: 700;
}
.active-job-progress {
  color: var(--muted);
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.active-job-open {
  min-height: 30px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: transparent;
  color: var(--text);
  padding: 4px 9px;
  font-size: 12px;
}
button.active-job-open:hover { background: var(--panel-hover); }
.roadmap-panel {
  width: min(840px, calc(100% - 44px));
  margin: 18px auto 0;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--panel);
  color: var(--text);
  padding: 12px 14px;
}
.empty-state .roadmap-panel {
  width: min(720px, 100%);
  margin: 0 auto 22px;
  text-align: left;
}
.roadmap-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--muted);
}
.roadmap-list {
  display: grid;
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.roadmap-item {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr);
  align-items: start;
  gap: 8px;
  font-size: 13px;
  line-height: 1.35;
}
.roadmap-item.done { color: var(--muted); }
.roadmap-item.done .roadmap-text { text-decoration: line-through; text-decoration-thickness: 1px; }
.roadmap-note {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.4;
}

.message-row { border-bottom: 1px solid rgba(255,255,255,.08); }
html[data-theme="light"] .message-row { border-bottom-color: rgba(0,0,0,.08); }
.message-row.assistant { background: var(--assistant-row); }
.message-inner {
  width: min(840px, 100%);
  margin: 0 auto;
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr);
  gap: 18px;
  padding: 24px 22px;
}
.avatar {
  width: 30px;
  height: 30px;
  border-radius: 4px;
  display: grid;
  place-items: center;
  color: white;
  overflow: hidden;
}
.avatar.user { background: #64748b; }
.avatar.assistant { background: var(--panel); border: 1px solid var(--line-soft); }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar .fallback { font-size: 13px; font-weight: 800; }
.msg-content {
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: break-word;
  padding-top: 1px;
  font-size: 16px;
  min-width: 0;
  max-width: 100%;
}
.msg-content-wrap {
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
}
.msg-content p { margin: 0 0 .8em; }
.msg-content p:last-child { margin-bottom: 0; }
.msg-content a {
  color: var(--accent);
  font-weight: 650;
  text-decoration: none;
  border-bottom: 1px solid rgba(16, 163, 127, .45);
}
.msg-content a:hover {
  border-bottom-color: currentColor;
}
.msg-content code {
  background: rgba(0,0,0,.22);
  border: 1px solid rgba(255,255,255,.08);
  padding: 2px 5px;
  border-radius: 4px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: .9em;
  color: var(--text);
}
html[data-theme="light"] .msg-content code {
  background: rgba(0,0,0,.07);
  border-color: rgba(0,0,0,.1);
}
.msg-content pre {
  margin: 12px 0;
  overflow-x: auto;
  max-width: 100%;
  background: #111318;
  border: 1px solid rgba(255,255,255,.1);
}
.msg-content pre code { background: transparent; border: 0; padding: 0; }

/* Code block wrapper with header */
.code-block {
  margin: 12px 0;
  border-radius: 8px;
  background: #111318;
  border: 1px solid rgba(255,255,255,.1);
  overflow: hidden;
  max-width: 100%;
}
.code-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 12px;
  background: rgba(255,255,255,.04);
  border-bottom: 1px solid rgba(255,255,255,.07);
  min-height: 36px;
}
.code-lang {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 11px;
  color: var(--subtle);
  text-transform: lowercase;
  letter-spacing: .04em;
}
.copy-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--faint);
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 5px;
  cursor: pointer;
  transition: color .15s, background .15s, border-color .15s;
  flex-shrink: 0;
}
.copy-btn:hover { color: var(--text); background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.12); }
.copy-btn.copied { color: var(--accent); }
.code-block pre {
  margin: 0;
  padding: 14px 16px;
  overflow-x: auto;
  background: transparent;
  border-radius: 0;
  border: 0;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: .87em;
  line-height: 1.6;
}
.code-block code {
  background: transparent;
  border: 0;
  padding: 0;
  font-family: inherit;
  font-size: inherit;
}
/* Syntax highlight spans */
.hl-comment { color: var(--hl-comment); font-style: italic; }
.hl-string   { color: var(--hl-string); }
.hl-number   { color: var(--hl-number); }
.hl-keyword  { color: var(--hl-keyword); font-weight: 600; }
.hl-function { color: var(--hl-function); }
.hl-boolean  { color: var(--hl-boolean); }
.hl-property { color: var(--hl-property); }
.hl-tag      { color: var(--hl-tag); }
.hl-attr     { color: var(--hl-attr); }
.typing:not(:has(*))::after,
.typing > *:last-child:not(:has(*))::after,
.typing > *:last-child > *:last-child:not(:has(*))::after,
.typing > *:last-child > *:last-child > *:last-child:not(:has(*))::after,
.typing > *:last-child > *:last-child > *:last-child > *:last-child:not(:has(*))::after {
  content: "";
  display: inline-block;
  width: 8px;
  height: 19px;
  margin-left: 4px;
  background: var(--muted);
  vertical-align: -4px;
  animation: blink 1s steps(2,start) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.composer-wrap {
  padding: 16px 18px calc(24px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--main) 82%, rgba(52,53,65,0));
}
.composer {
  width: min(860px, 100%);
  margin: 0 auto;
  background: var(--panel);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 6px;
  box-shadow: 0 0 15px rgba(0,0,0,.13);
  display: grid;
  grid-template-columns: 1fr 46px;
  align-items: end;
}
html[data-theme="light"] .composer { border-color: rgba(0,0,0,.14); }
.composer:focus-within { border-color: rgba(255,255,255,.28); }
html[data-theme="light"] .composer:focus-within { border-color: rgba(0,0,0,.28); }
#chatInput {
  width: 100%;
  min-height: 54px;
  max-height: 190px;
  resize: none;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  padding: 16px 0 15px 16px;
  line-height: 1.45;
}
#chatInput::placeholder { color: #b5b5c3; }
html[data-theme="light"] #chatInput::placeholder { color: #6b7280; }
.send-btn {
  width: 34px;
  height: 34px;
  margin: 10px 8px 10px 0;
  border: 0;
  border-radius: 6px;
  color: var(--text);
  background: transparent;
  display: grid;
  place-items: center;
}
.send-btn:hover:not(:disabled) { background: rgba(255,255,255,.13); }
html[data-theme="light"] .send-btn:hover:not(:disabled) { background: rgba(0,0,0,.08); }
.send-btn:disabled { opacity: .35; cursor: default; }
.composer-note {
  width: min(860px, 100%);
  margin: 10px auto 0;
  color: var(--subtle);
  font-size: 12px;
  text-align: center;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(8px);
}
.modal-backdrop.hidden { display: none; }
.modal {
  width: min(440px, 100%);
  background: var(--sidebar);
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
html[data-theme="light"] .modal { border-color: rgba(0,0,0,.14); }
.modal-head {
  padding: 20px 22px 15px;
  border-bottom: 1px solid var(--line-soft);
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 14px;
}
.modal-title { margin: 0; font-size: 23px; letter-spacing: -.02em; }
.modal-close {
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--muted);
  display: grid;
  place-items: center;
}
.modal-close:hover { background: rgba(255,255,255,.08); color: var(--text); }
html[data-theme="light"] .modal-close:hover { background: rgba(0,0,0,.06); }
.auth-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: rgba(0,0,0,.24);
  padding: 4px;
  margin: 16px 22px 0;
  border-radius: var(--radius);
}
html[data-theme="light"] .auth-tabs { background: rgba(0,0,0,.06); }
.auth-tab {
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: 5px;
  padding: 10px;
}
.auth-tab.active { background: var(--panel); color: var(--text); }
.modal-body { padding: 20px 22px 22px; }
.form { display: grid; gap: 13px; }
.form.hidden { display: none; }
.field { display: grid; gap: 6px; }
.field label { color: var(--muted); font-size: 13px; }
.field input {
  width: 100%;
  height: 44px;
  border-radius: var(--radius);
  border: 1px solid rgba(255,255,255,.14);
  background: var(--main-soft);
  color: var(--text);
  outline: 0;
  padding: 0 12px;
}
html[data-theme="light"] .field input { border-color: rgba(0,0,0,.14); }
.field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(16,163,127,.16); }
.primary {
  height: 44px;
  border: 0;
  border-radius: var(--radius);
  background: var(--accent);
  color: white;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.primary:hover:not(:disabled) { filter: brightness(1.08); }
.primary:disabled { opacity: .65; cursor: wait; }
.error {
  display: none;
  color: #fecaca;
  background: rgba(239,68,68,.15);
  border: 1px solid rgba(239,68,68,.35);
  border-radius: var(--radius);
  padding: 10px 12px;
  font-size: 13px;
}
.error.show { display: block; }
.toast {
  position: fixed;
  z-index: 90;
  left: 50%;
  bottom: 88px;
  transform: translateX(-50%) translateY(20px);
  opacity: 0;
  pointer-events: none;
  background: var(--sidebar);
  color: var(--text);
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 8px;
  padding: 10px 14px;
  box-shadow: 0 14px 40px rgba(0,0,0,.35);
  transition: opacity .18s ease, transform .18s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.sidebar-shade {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.46);
  z-index: 30;
}

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .main { grid-template-rows: auto minmax(0, 1fr) auto; }
  #chatInput, input, textarea { font-size: 16px !important; }
  .mobile-topbar {
    padding-top: env(safe-area-inset-top, 0px);
    height: calc(50px + env(safe-area-inset-top, 0px));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    border-bottom: 1px solid var(--line-soft);
    background: var(--main);
  }

  border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow: 0 4px 15px rgba(255, 255, 255, 0.04);
  margin-bottom: 12px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  width: fit-content;
  max-width: 100%;
  user-select: none;
}

.status-spinner {
  width: 11px;
  height: 11px;
  border: 1.5px solid #ffffff;
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes blink-cursor {
  50% { opacity: 0; }
}
.blinking-cursor {
  display: inline-block;
  width: 8px;
  height: 19px;
  margin-left: 4px;
  background: var(--muted);
  vertical-align: -4px;
  animation: blink 1s steps(2,start) infinite;
}
.thinking-stream.instant {
  min-height: 28px;
  margin-bottom: 12px;
}

/* Send button stops model generation */
.send-btn.generating {
  background: var(--danger) !important;
  color: #ffffff !important;
  opacity: 1 !important;
  cursor: pointer !important;
}
.send-btn.generating:hover {
  background: #dc2626 !important;
}

/* Premium Download Button */
.zip-download-card {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-top: 14px;
  width: fit-content;
  max-width: 100%;
}
html[data-theme="light"] .zip-download-card {
  background: rgba(0, 0, 0, 0.02);
}

.zip-download-btn {
  background: var(--accent);
  color: #ffffff;
  border: none;
  border-radius: 4px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 650;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  transition: opacity 0.15s ease;
}
.zip-download-btn:hover {
  opacity: 0.9;
}

.cron-job-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 10px 12px;
  gap: 10px;
  width: 100%;
}
html[data-theme="light"] .cron-job-item {
  background: rgba(0, 0, 0, 0.015);
}

.cron-job-meta {
  display: grid;
  gap: 2px;
  min-width: 0;
  flex: 1;
}
.cron-job-name {
  font-weight: 700;
  color: var(--text);
}
.cron-job-expr {
  font-family: monospace;
  color: var(--accent);
  font-size: 11px;
}
.cron-job-cmd {
  font-family: monospace;
  color: var(--faint);
  font-size: 11.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cron-model-picker {
  position: relative;
}
.cron-model-btn {
  width: 100%;
  min-height: 38px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--main);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 10px;
  cursor: pointer;
  font: inherit;
}
.cron-model-btn > span {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.cron-model-btn strong {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cron-model-dropdown {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(100% + 5px);
  max-height: 220px;
  overflow-y: auto;
  background: var(--sidebar);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 16px 32px rgba(0,0,0,.32);
  z-index: 130;
}
.cron-model-dropdown.hidden {
  display: none;
}
.cron-job-delete {
  background: transparent;
  border: none;
  color: var(--faint);
  padding: 6px;
  border-radius: 4px;
  cursor: pointer;
  display: grid;
  place-items: center;
}
.cron-job-delete:hover {
  color: var(--danger);
  background: rgba(239, 68, 68, 0.1);

function endpoint(path) {

function shouldUseAgentJob(text, attachments = []) {
  const lowered = (text || "").toLowerCase().trim();
  if (!lowered && attachments.length) return true;
  if (/^(hi|hello|hey|yo|sup|thanks|thank you|ok|okay|cool|nice|lol)[!.\s]*$/.test(lowered)) {
    return false;
  }
  if (/\b(read|show|list|print|display|contents?)\b/.test(lowered) && /\b(memory|user|agents|tools|identity|soul)\.md\b/.test(lowered)) {
    return false;
  }
  const fileExt = "\\.(?:py|js|jsx|ts|tsx|html|css|md|json|sh|yaml|yml|toml|sql)\\b";
  const strongPatterns = [
    /\bdownload(?:able|\s+link)?\b/i,
    /\bfull\s+(?:game|app|application|website|project)\b/i,
    /\bmulti[-\s]?file\b/i,
    /\bcomplete\s+runnable\b/i,
    /\b(?:create|make)\s+(?:a\s+)?(?:folder|directory)\b/i,
    /\binside\s+(?:the\s+)?workspace\b/i,
    /\bfix\s+(?:all|these|this|that|it|the\s+(?:bug|error|issue|code|script|app|game|file|project))\b/i,
    /\bdebug\b/i,
    /\binstall\b/i,
    new RegExp(`\\btest\\s+(?:it|this|that|the\\s+(?:code|script|app|game|project|file)|[./\\w-]+${fileExt})\\b`, "i"),
    new RegExp(`\\brun\\s+(?:it|this|that|the\\s+(?:code|script|app|game|project|file)|[./\\w-]+${fileExt})\\b`, "i")
  ];
  const actionPattern = /\b(make|create|build|write|implement|edit|update|fix|debug|install|scaffold)\b/i;
  const artifactPattern = new RegExp(`\\b(app|game|script|project|website|web\\s*app|server|api|directory|folder|file|files|component|page)\\b|${fileExt}`, "i");
  const workspaceMentionPattern = new RegExp(`\\b(workspace|director(?:y|ies)|folders?|files?|terminal|execute|server|web\\s*server|localhost|screenshot|playwright|selenium)\\b|\\b(?:memory|agents|tools|user|identity|soul)\\.md\\b|${fileExt}`, "i");
  const requiresWorkspace = strongPatterns.some(pattern => pattern.test(lowered)) || (actionPattern.test(lowered) && artifactPattern.test(lowered));
  return attachments.length > 0 || requiresWorkspace || workspaceMentionPattern.test(lowered);
}

async function postJson(path, payload, signal) {
  const headers = { "Content-Type": "application/json" };
  if (state.token) headers.Authorization = `Bearer ${state.token}`;

  const res = await fetch(endpoint(path), {
    method: "POST",
    headers,
    credentials: "include",
    body: JSON.stringify(payload),
    signal
  });

  if (res.headers.get("content-type")?.includes("text/event-stream")) {
    if (!res.ok) throw new Error(`Request failed: ${res.status}`);
    return res;
  }

  const text = await res.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; }
  catch { data = { text }; }

  if (!res.ok) throw new Error(data.error || data.message || data.detail || `Request failed: ${res.status}`);
  return data;
}

async function getJson(path) {
  const headers = {};
  if (state.token) headers.Authorization = `Bearer ${state.token}`;
  const res = await fetch(endpoint(path), { headers, credentials: "include" });
  const text = await res.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; }
  catch { data = { text }; }
  if (!res.ok) throw new Error(data.error || data.message || data.detail || `Request failed: ${res.status}`);
  return data;
}

function extractReply(data) {
  if (typeof data === "string") return data;
  return data.reply
    || data.content
    || data.text
    || data.output
    || data.delta?.content
    || data.message?.content
    || data.message
    || data.choices?.[0]?.message?.content
    || data.choices?.[0]?.delta?.content
    || "";
}

function extractThinking(data) {
  if (!data || typeof data === "string") return "";
  return data.reasoning
    || data.thinking
    || data.thought
    || data.thoughts
    || data.reasoning_content
    || data.delta?.reasoning
    || data.delta?.thinking
    || data.delta?.thought
    || data.delta?.reasoning_content
    || data.message?.reasoning
    || data.message?.thinking
    || data.message?.thought
    || data.message?.reasoning_content
    || data.choices?.[0]?.message?.reasoning
    || data.choices?.[0]?.message?.reasoning_content
    || data.choices?.[0]?.delta?.reasoning
    || data.choices?.[0]?.delta?.thinking
    || data.choices?.[0]?.delta?.thought
    || data.choices?.[0]?.delta?.reasoning_content
    || "";
}

function splitThinkingBlocks(value) {
  const src = String(value || "");
  const thoughts = [];
  let visible = "";
  let index = 0;
  const openTag = /<think>/ig;
  while (index < src.length) {
    openTag.lastIndex = index;
    const open = openTag.exec(src);
    if (!open) {
      visible += src.slice(index);
      break;
    }
    visible += src.slice(index, open.index);
    const close = src.toLowerCase().indexOf("</think>", openTag.lastIndex);
    if (close === -1) {
      thoughts.push(src.slice(openTag.lastIndex));
      break;
    }
    thoughts.push(src.slice(openTag.lastIndex, close));
    index = close + "</think>".length;
  }
  return { visible, thoughts };
}

function cleanThinkingLine(value) {
  return String(Array.isArray(value) ? value.join(" ") : value || "")
    .replace(/<\/?think>/gi, "")
    .replace(/\s+/g, " ")
    .trim();
}

async function readSse(res, onChunk) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const packets = buffer.split("\n\n");
    buffer = packets.pop() || "";
    for (const packet of packets) {
      const lines = packet.split("\n").filter(line => line.startsWith("data:"));
      for (const line of lines) {
        const raw = line.replace(/^data:\s?/, "");
        if (raw === "[DONE]") return;
        try {
          const parsed = JSON.parse(raw);
          onChunk(extractReply(parsed), extractThinking(parsed), parsed);
        }
        catch { onChunk(raw, "", null); }
      }
    }
  }
}

function hasMessages(chat) {
  return !!chat && Array.isArray(chat.messages) && chat.messages.length > 0;
}

function normalizeChats() {
  state.chats = (Array.isArray(state.chats) ? state.chats : [])
    .filter(hasMessages)
    .sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));

  if (state.activeChatId && !state.chats.some(c => c.id === state.activeChatId)) {
    state.activeChatId = "";
  }
}

function createChat() {
  const chat = {
    id: uuid(),
    title: "New chat",
    titleSource: "auto",
    messages: [],
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
  state.chats.unshift(chat);
  state.activeChatId = chat.id;
  return chat;
}

function saveAll() {
  refreshAutoChatTitles();
  const persistedChats = state.chats.filter(hasMessages).slice(0, 100);
  const persistedActiveId = persistedChats.some(c => c.id === state.activeChatId) ? state.activeChatId : "";

  storage.set("geo_chats_v4", persistedChats);
  storage.set("geo_active_chat_id_v4", persistedActiveId);

  if (state.token && state.activeChatId) {
    const chat = state.chats.find(c => c.id === state.activeChatId);
    if (hasMessages(chat)) {
      saveChatToServer(chat);
    }
  }
}

async function saveChatToServer(chat) {
  if (!state.token) return;
  try {
    await postJson(API.chats, chat);
  } catch (err) {
    console.error("Failed to save chat to user profile:", err);
  }
}

async function loadChatsFromServer() {
  if (!state.token) return;
  try {
    const headers = {};
    if (state.token) headers.Authorization = `Bearer ${state.token}`;
    const res = await fetch(endpoint(API.chats), { headers });
    if (res.ok) {
      const data = await res.json();
      const serverChats = (data.chats || []).filter(hasMessages);
      const localChats = (state.chats || []).filter(hasMessages);

      // Auto-upload/merge guest chats that have real messages and don't exist on server yet.
      for (const localChat of localChats) {
        if (!serverChats.some(sc => sc.id === localChat.id)) {
          await saveChatToServer(localChat);
          serverChats.unshift(localChat);
        }
      }

      state.chats = serverChats
        .filter((chat, index, list) => list.findIndex(item => item.id === chat.id) === index)
        .sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
      const retitledChats = refreshAutoChatTitles();

      if (state.activeChatId && !state.chats.some(c => c.id === state.activeChatId)) {
        state.activeChatId = "";
      }

      saveAll();
      retitledChats.forEach(chat => saveChatToServer(chat));
      renderChatList();
      renderMessages();
    }
  } catch (err) {
    console.error("Failed to load chats from user profile:", err);
  }
}

function activeChat(createIfMissing = true) {
  let chat = state.chats.find(c => c.id === state.activeChatId);
  if (!chat && createIfMissing) {
    chat = createChat();
    saveAll();
  }
  return chat || null;
}

function legacyPromptTitle(text) {
  const clean = text.replace(/\s+/g, " ").trim();
  return clean.length > 34 ? `${clean.slice(0, 34)}...` : clean || "New chat";
}

const TITLE_ACRONYMS = new Set(["ai", "api", "css", "html", "js", "json", "sql", "ui", "url", "ux", "db"]);
const TITLE_SMALL_WORDS = new Set(["a", "an", "and", "as", "at", "by", "for", "from", "in", "into", "of", "on", "or", "the", "to", "with"]);

function titleCaseTopic(value) {
  return String(value || "")
    .split(/\s+/)
    .filter(Boolean)
    .map((word, index) => {
      const clean = word.replace(/^[^\w]+|[^\w]+$/g, "");
      const lower = clean.toLowerCase();
      if (TITLE_ACRONYMS.has(lower)) return lower.toUpperCase();
      if (index > 0 && TITLE_SMALL_WORDS.has(lower)) return lower;
      return lower ? lower.charAt(0).toUpperCase() + lower.slice(1) : word;
    })
    .join(" ")
    .replace(/\bGeocentric\b/gi, "Geocentric");
}

function topicPhrase(text) {
  let clean = String(text || "")
    .replace(/```[\s\S]*?```/g, " ")
    .replace(/https?:\/\/\S+/g, " ")
    .replace(/[“”]/g, '"')
    .replace(/[‘’]/g, "'")
    .replace(/\s+/g, " ")
    .trim();

  clean = clean
    .replace(/^(hey|hi|hello|yo|please|pls|can you|could you|would you|will you|i need you to|i want you to|help me|how do i|how to)\b[:,\s]*/i, "")
    .replace(/\b(unless|because|when|while|after|before|so that|and then)\b[\s\S]*$/i, "")
    .replace(/[?.!,;:]+$/g, "")
    .trim();

  const words = clean.split(/\s+/).filter(Boolean);
  const compact = words.slice(0, 7).join(" ");
  return titleCaseTopic(compact);
}

function makeTitle(text, assistantText = "") {
  const userText = String(text || "");
  const assistant = String(assistantText || "");
  if (!userText.trim() && assistant.trim()) return topicPhrase(assistant) || "New chat";

  const lower = userText.toLowerCase();
  const phrase = topicPhrase(userText);
  if (!phrase) return "New chat";

  if (/\b(fix|debug|repair|broken|error|bug|issue|off screen|overflow|scroll)\b/.test(lower)) {
    return `Fix ${topicPhrase(userText.replace(/\b(fix|debug|repair|broken|error|bug|issue|the|a|an|with|being|is|are|it|this|that)\b/gi, " ")) || phrase}`.slice(0, 48);
  }
  if (/\b(add|implement|support|include|integrate)\b/.test(lower)) {
    return `Add ${topicPhrase(userText.replace(/\b(add|implement|support|include|integrate|feature|where|the|a|an)\b/gi, " ")) || phrase}`.slice(0, 48);
  }
  if (/\b(build|create|make|write|generate|design)\b/.test(lower)) {
    return `Build ${topicPhrase(userText.replace(/\b(build|create|make|write|generate|design|a|an|the)\b/gi, " ")) || phrase}`.slice(0, 48);
  }
  if (/^\s*(what|why|how|where|when|who)\b/i.test(userText)) {
    return titleCaseTopic(phrase).slice(0, 48);
  }
  return phrase.slice(0, 48);
}

function extractChatTitleTag(text) {
  const match = String(text || "").match(/<chat_title\b[^>]*>([\s\S]*?)<\/chat_title>/i);
  if (!match) return "";
  return titleCaseTopic(match[1].replace(/\s+/g, " ").trim()).slice(0, 48);
}

function chatAutoTitle(chat) {
  if (!chat || !Array.isArray(chat.messages)) return "New chat";
  const firstUser = chat.messages.find(m => m.role === "user" && String(m.content || "").trim());
  const firstAssistant = chat.messages.find(m => m.role === "assistant" && String(m.content || "").trim());
  if (!firstUser && chat.messages.some(m => Array.isArray(m.attachments) && m.attachments.length)) return "Attached Files";
  return makeTitle(firstUser?.content || "", firstAssistant?.content || "");
}

function shouldReplaceChatTitle(chat) {
  if (!chat) return false;
  const current = String(chat.title || "").trim();
  const firstUser = chat.messages?.find?.(m => m.role === "user" && String(m.content || "").trim());
  if (!current || current === "New chat") return true;
  if (chat.titleSource === "auto") return true;
  return firstUser ? current === legacyPromptTitle(firstUser.content || "") : false;
}

function refreshAutoChatTitles() {
  const changed = [];
  state.chats.forEach(chat => {
    if (!hasMessages(chat) || !shouldReplaceChatTitle(chat)) return;
    const nextTitle = chatAutoTitle(chat);
    if (nextTitle && nextTitle !== chat.title) {
      chat.title = nextTitle;
      chat.titleSource = "auto";
      changed.push(chat);
    }
  });
  return changed;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>'"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[ch]));
}

function unescapeForUrl(value) {
  return String(value || "")
    .replace(/&amp;/g, "&")
    .replace(/&quot;/g, '"')
    .replace(/&#39;/g, "'");
}

function niceUrlLabel(rawUrl) {
  try {
    const normalized = rawUrl.startsWith("www.") ? `https://${rawUrl}` : rawUrl;
    const url = new URL(unescapeForUrl(normalized));
    const host = url.hostname.replace(/^www\./, "");
    const parts = url.pathname.split("/").filter(Boolean);
    const last = parts[parts.length - 1] || "";
    const page = decodeURIComponent(last)
      .replace(/\.[a-z0-9]{2,5}$/i, "")
      .replace(/[-_+]+/g, " ")
      .replace(/\s+/g, " ")
      .trim()
      .replace(/\b\w/g, char => char.toUpperCase());
    const label = page ? `${host} - ${page}` : host;
    return label.length > 74 ? `${label.slice(0, 71)}...` : label;
  } catch {
    return rawUrl.replace(/^https?:\/\//, "").replace(/^www\./, "").slice(0, 74);
  }
}

function isInternalDownloadUrl(url) {
  return url.startsWith("/api/download/") ||
    url.startsWith("/download/") ||
    url.startsWith("/api/workspaces/") ||
    url.startsWith("/workspaces/");
}

function linkifyEscapedText(escaped) {
  const links = [];
  const saveLink = (href, label) => {
    const id = links.length;
    let url = unescapeForUrl(href).trim();

    // Normalize relative paths that might be written in various formats
    if (url.startsWith("api.download/")) {
      url = "/api/download/" + url.substring(13);
    } else if (url.startsWith("api/download/")) {
      url = "/api/download/" + url.substring(13);
    } else if (url.startsWith("download/")) {
      url = "/download/" + url.substring(9);
    } else if (url.startsWith("workspaces/")) {
      url = "/workspaces/" + url.substring(11);
    }

    // Properly URL-encode spaces and special characters in the path segment
    url = url.split("?").map((part, i) => i === 0 ? encodeURI(part) : part).join("?");

    const safeHref = escapeHtml(url);
    const safeLabel = escapeHtml(label || niceUrlLabel(href));
    const internalDownload = isInternalDownloadUrl(url) ? ` data-internal-download="true"` : "";
    const target = internalDownload ? "" : ` target="_blank" rel="noopener noreferrer"`;
    links.push(`<a href="${safeHref}"${target}${internalDownload}>${safeLabel}</a>`);
    return `\x03LINK${id}\x03`;
  };

  // Match absolute links as well as relative paths (allowing spaces in parentheses)
  let output = escaped.replace(/\[([^\]\n]{1,160})\]\(((?:https?:\/\/|file:\/\/|\/|\.\/|api\.download|api\/download|download\/|[a-zA-Z0-9_\-\.\/#])[^)]*)\)/g, (_, label, href) => saveLink(href, label));
  output = output.replace(/(^|[\s(])((?:https?:\/\/|www\.|api\.download\/|api\/download\/|\/api\/download\/|\/download\/)[^\s<]+)/g, (match, prefix, url) => {
    let cleanUrl = url;
    let trailing = "";
    while (/[),.!?;:]$/.test(cleanUrl)) {
      trailing = cleanUrl.slice(-1) + trailing;
      cleanUrl = cleanUrl.slice(0, -1);
    }
    return `${prefix}${saveLink(cleanUrl, niceUrlLabel(cleanUrl))}${trailing}`;
  });
  return output.replace(/\x03LINK(\d+)\x03/g, (_, id) => links[Number(id)] || "");
}

function renderInlineText(escaped) {
  return escaped.split(/(`[^`\n]+`)/g).map(part => {
    if (part.startsWith("`") && part.endsWith("`")) {
      return `<code>${part.slice(1, -1)}</code>`;
    }
    return linkifyEscapedText(part).replace(/\n/g, "<br>");
  }).join("");
}

function syntaxHighlight(code, lang) {
  if (!lang) return code;
  const L = lang.toLowerCase();
  const normL = {jsx:'js',tsx:'ts',sh:'bash',shell:'bash',zsh:'bash',kt:'java',kotlin:'java',c:'c',cpp:'cpp'}[L] || L;
  const saved = [];
  function save(str, cls) {
    const i = saved.length;
    saved.push(cls ? `<span class="hl-${cls}">${str}</span>` : str);
    return `\x02${i.toString(36)}\x02`;
  }
  let r = code;
  // Block comments
  if (['js','ts','jsx','tsx','c','cpp','java','swift','go','rust','css','scss','php','kotlin','kt'].some(x=>x===L||x===normL)) {
    r = r.replace(/\/\*[\s\S]*?\*\//g, m => save(m,'comment'));
  }
  // HTML/XML comments
  if (['html','xml'].includes(L)) r = r.replace(/&lt;!--[\s\S]*?--&gt;/g, m => save(m,'comment'));
  // SQL comments
  if (L==='sql') r = r.replace(/--[^\n]*/g, m => save(m,'comment'));
  // Line comments //
  if (['js','ts','jsx','tsx','c','cpp','java','swift','go','rust','php'].some(x=>x===L||x===normL)) {
    r = r.replace(/\/\/[^\n]*/g, m => save(m,'comment'));
  }
  // Hash comments
  if (['py','python','ruby','bash','sh','shell','zsh'].some(x=>x===L)) {
    r = r.replace(/#[^\n]*/g, m => save(m,'comment'));
  }
  // CSS comments
  if (['css','scss'].includes(L)) r = r.replace(/\/\*[\s\S]*?\*\//g, m => save(m,'comment'));

  // Python triple-quoted strings
  if (['py','python'].includes(L)) r = r.replace(/"""[\s\S]*?"""|'''[\s\S]*?'''/g, m => save(m,'string'));
  // Template literals
  if (['js','ts','jsx','tsx'].some(x=>x===L)) r = r.replace(/`[^`]*`/g, m => save(m,'string'));
  // Double-quoted strings
  r = r.replace(/"(?:[^"\\]|\\.)*"/g, m => save(m,'string'));
  // Single-quoted strings
  r = r.replace(/'(?:[^'\\]|\\.)*'/g, m => save(m,'string'));

  // HTML/XML tags & attrs
  if (['html','xml'].includes(L)) {
    r = r.replace(/(&lt;\/?)([\w-]+)/g, (_,b,t) => `${save(b+t,'tag')}`);
    r = r.replace(/([\w-]+)(?==)/g, m => save(m,'attr'));
  }

  // Numbers
  r = r.replace(/\b-?\d+\.?\d*(?:[eE][+-]?\d+)?\b/g, m => save(m,'number'));

  // Keywords by language
  const KW = {
    js:   'async|await|break|case|catch|class|const|continue|debugger|default|delete|do|else|export|extends|finally|for|from|function|if|import|in|instanceof|let|new|of|return|static|super|switch|this|throw|try|typeof|var|void|while|with|yield',
    ts:   'abstract|as|async|await|break|case|catch|class|const|continue|declare|default|delete|do|else|enum|export|extends|finally|for|from|function|if|implements|import|in|instanceof|interface|keyof|let|namespace|new|of|readonly|return|static|super|switch|this|throw|try|type|typeof|var|void|while|yield',
    py:   'and|as|assert|async|await|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|nonlocal|not|or|pass|raise|return|try|while|with|yield',
    java: 'abstract|assert|boolean|break|byte|case|catch|char|class|const|continue|default|do|double|else|enum|extends|final|finally|float|for|if|implements|import|instanceof|int|interface|long|native|new|package|private|protected|public|return|short|static|strictfp|super|switch|synchronized|this|throw|throws|transient|try|var|void|volatile|while',
    go:   'break|case|chan|const|continue|default|defer|else|fallthrough|for|func|go|goto|if|import|interface|map|package|range|return|select|struct|switch|type|var',
    rust: 'as|break|const|continue|crate|dyn|else|enum|extern|fn|for|if|impl|in|let|loop|match|mod|move|mut|pub|ref|return|self|static|struct|super|trait|type|unsafe|use|where|while|async|await',
    sql:  'SELECT|FROM|WHERE|JOIN|LEFT|RIGHT|INNER|OUTER|CROSS|ON|GROUP|BY|ORDER|HAVING|LIMIT|OFFSET|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|DROP|ALTER|ADD|COLUMN|INDEX|PRIMARY|FOREIGN|KEY|REFERENCES|NOT|NULL|AND|OR|AS|DISTINCT|COUNT|SUM|AVG|MIN|MAX|BETWEEN|LIKE|IN|EXISTS|UNION|ALL|CASE|WHEN|THEN|END',
    bash: 'if|then|else|elif|fi|for|while|do|done|case|esac|in|function|return|echo|exit|source|local|export|readonly|declare|unset|shift|break|continue',
    php:  'abstract|and|array|as|break|callable|case|catch|class|clone|const|continue|declare|default|do|echo|else|elseif|extends|final|finally|fn|for|foreach|function|global|if|implements|interface|match|namespace|new|or|private|protected|public|require|return|static|switch|throw|trait|try|use|var|while|yield',
    ruby: 'BEGIN|END|alias|and|begin|break|case|class|def|do|else|elsif|end|ensure|for|if|in|module|next|not|or|redo|rescue|retry|return|self|super|then|undef|unless|until|when|while|yield',
    swift:'associatedtype|class|deinit|enum|extension|fileprivate|func|import|init|inout|internal|let|open|operator|private|protocol|public|rethrows|static|struct|subscript|typealias|var|break|case|continue|default|defer|do|else|fallthrough|for|guard|if|in|repeat|return|throw|switch|where|while|as|catch|throws|try',
    c:    'auto|break|case|char|const|continue|default|do|double|else|enum|extern|float|for|goto|if|inline|int|long|register|return|short|signed|sizeof|static|struct|switch|typedef|union|unsigned|void|volatile|while',
    cpp:  'auto|break|case|catch|char|class|const|constexpr|continue|default|delete|do|double|else|enum|explicit|extern|float|for|friend|goto|if|inline|int|long|mutable|namespace|new|noexcept|nullptr|operator|override|private|protected|public|register|return|short|signed|sizeof|static|struct|switch|template|this|throw|try|typedef|typename|union|unsigned|using|virtual|void|volatile|while',
  };
  const kwStr = KW[normL] || KW[L];
  if (kwStr) r = r.replace(new RegExp(`\\b(${kwStr})\\b`,'g'), m => save(m,'keyword'));

  // Booleans / null / special values
  r = r.replace(/\b(true|false|null|undefined|None|True|False|nil|NULL|NaN|Infinity)\b/g, m => save(m,'boolean'));

  // Function/method calls
  if (!['html','xml','css','scss','sql','bash'].includes(L)) {
    r = r.replace(/\b([a-zA-Z_$][\w$]*)\s*(?=\()/g, (m, name) => save(name,'function') + m.slice(name.length));
  }

  // CSS properties
  if (['css','scss'].includes(L)) {
    r = r.replace(/^(\s*)([a-z-]+)(\s*:)/gm, (_,s,p,c) => `${s}${save(p,'property')}${c}`);
  }
  // JSON keys
  if (L==='json') {
    r = r.replace(/"([^"]+)"(?=\s*:)/g, m => save(m,'property'));
  }

  // Restore all placeholders
  saved.forEach((html, i) => { r = r.split(`\x02${i.toString(36)}\x02`).join(html); });
  return r;
}

let _copyTimer = {};
function copyCode(btn, codeId) {
  const el = document.getElementById(codeId);
  if (!el) return;
  const text = el.innerText || el.textContent || '';
  const label = btn.querySelector('span');
  const orig = label ? label.textContent : '';
  function onSuccess() {
    btn.classList.add('copied');
    if (label) { label.textContent = 'Copied!'; btn.innerHTML = btn.innerHTML.replace(/stroke="currentColor"/,'style="display:none"'); }
    // swap icon to check
    btn.querySelector('svg')?.remove();
    btn.insertAdjacentHTML('afterbegin', iconSvg('check', 'icon small'));
    if (label) label.textContent = 'Copied!';
    clearTimeout(_copyTimer[codeId]);
    _copyTimer[codeId] = setTimeout(() => {
      btn.classList.remove('copied');
      btn.querySelector('svg')?.remove();
      btn.insertAdjacentHTML('afterbegin', iconSvg('copy', 'icon small'));
      if (label) label.textContent = orig;
    }, 2000);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(onSuccess).catch(() => fallbackCopy(text, onSuccess));
  } else {
    fallbackCopy(text, onSuccess);
  }
}
function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  Object.assign(ta.style, { position:'fixed', top:'0', left:'0', opacity:'0', pointerEvents:'none' });
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { if (document.execCommand('copy')) cb(); } catch {}
  document.body.removeChild(ta);
}

function filenameFromDownloadResponse(url, response) {
  const disposition = response.headers.get("content-disposition") || "";
  const headerMatch = disposition.match(/filename\*?=(?:UTF-8''|")?([^";]+)/i);
  if (headerMatch) {
    try { return decodeURIComponent(headerMatch[1].replace(/^"|"$/g, "")); } catch {}
    return headerMatch[1].replace(/^"|"$/g, "");
  }
  try {
    const parsed = new URL(url, window.location.origin);
    const last = parsed.pathname.split("/").filter(Boolean).pop();
    return decodeURIComponent(last || "download");
  } catch {
    return "download";
  }
}

async function downloadInternalLink(anchor) {
  const href = anchor.getAttribute("href") || "";
  if (!href || !state.token) return false;
  const url = new URL(href, window.location.origin);
  if (!isInternalDownloadUrl(url.pathname)) return false;

  const response = await fetch(url.pathname + url.search, {
    method: "GET",
    headers: { Authorization: `Bearer ${state.token}` },
    credentials: "include"
  });
  if (!response.ok) {
    let message = `Download failed: ${response.status}`;
    try {
      const data = await response.json();
      message = data.detail || data.error || message;
    } catch {}
    throw new Error(message);
  }

  const blob = await response.blob();
  const objectUrl = URL.createObjectURL(blob);
  const temp = document.createElement("a");
  temp.href = objectUrl;
  temp.download = anchor.getAttribute("download") || filenameFromDownloadResponse(href, response);
  document.body.appendChild(temp);
  temp.click();
  temp.remove();
  setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
  return true;
}

function renderText(text) {
  const src = stripInternalTagsJS(text || '');
  const codeBlocks = [];
  // Extract fenced code blocks before HTML-escaping
  let withHoles = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const id = codeBlocks.length;
    codeBlocks.push({ lang: lang.trim(), code: code.trim() });
    return `\x00CODEBLOCK${id}\x00`;
  });

  // Extract image galleries before HTML-escaping
  const galleries = [];
  withHoles = withHoles.replace(/<images>([\s\S]*?)<\/images>/ig, (_, body) => {
    const urls = body.split("\n")
      .map(line => line.trim())
      .filter(line => line.startsWith("http://") || line.startsWith("https://") || line.startsWith("/api/download/") || line.startsWith("/download/"));
    if (!urls.length) return "";
    const id = galleries.length;
    const galleryHtml = `
      <div class="image-gallery-grid">
        ${urls.map(url => `
          <div class="image-gallery-item" onclick="window.open('${escapeHtml(url)}', '_blank')">
            <img src="${escapeHtml(url)}" class="gallery-img" alt="Gallery Image" onerror="this.src='https://placehold.co/300x200?text=Image+Load+Error'" />
          </div>
        `).join("")}
      </div>
    `;
    galleries.push(galleryHtml);
    return `\x00GALLERY${id}\x00`;
  });

  // Process as segments so paragraphs don't wrap code blocks or galleries
  const segments = withHoles.split(/(\x00CODEBLOCK\d+\x00|\x00GALLERY\d+\x00)/);
  return segments.map((seg, idx) => {
    if (idx % 2 === 1) {
      if (seg.startsWith('\x00CODEBLOCK')) {
        const id = parseInt(seg.match(/\d+/)[0]);
        const block = codeBlocks[id];
        const lang = block.lang || '';
        const escapedCode = escapeHtml(block.code);
        const highlighted = syntaxHighlight(escapedCode, lang);
        const codeId = 'cb-' + Math.random().toString(36).slice(2, 9);
        return `<div class="code-block"><div class="code-header"><span class="code-lang">${lang || 'code'}</span><button class="copy-btn" onclick="copyCode(this,'${codeId}')">${iconSvg('copy','icon small')}<span>Copy</span></button></div><pre><code id="${codeId}">${highlighted}</code></pre></div>`;
      } else if (seg.startsWith('\x00GALLERY')) {
        const id = parseInt(seg.match(/\d+/)[0]);
        return galleries[id] || '';
      }
    }
    // Regular text segment
    const escapedSeg = escapeHtml(seg);
    return escapedSeg
      .split(/\n{2,}/)
      .map(part => part.trim() ? `<p>${renderInlineText(part)}</p>` : '')
      .join('');
  }).join('');
}

function roadmapHtml(chatId) {
  const roadmap = (state.roadmaps && state.roadmaps[chatId]) || "";
  if (!roadmap.trim()) return "";
  const lines = roadmap.split("\n").map(line => line.trim()).filter(Boolean);
  const items = [];
  const notes = [];
  lines.forEach(line => {
    const match = line.match(/^[-*]\s+\[([ xX])\]\s*(.+)$/);
    if (match) {
      items.push({ done: match[1].toLowerCase() === "x", text: match[2] });
    } else if (!line.startsWith("#")) {
      notes.push(line.replace(/^[-*]\s*/, ""));
    }
  });
  if (!items.length && !notes.length) return "";
  return `
    <section class="roadmap-panel" aria-label="Current roadmap">
      <div class="roadmap-title">${iconSvg("check", "icon small")}<span>Current Roadmap</span></div>
      ${items.length ? `<ul class="roadmap-list">${items.map(item => `
        <li class="roadmap-item ${item.done ? "done" : ""}">
          ${iconSvg(item.done ? "check" : "square", "icon small")}
          <span class="roadmap-text">${escapeHtml(item.text)}</span>
        </li>`).join("")}</ul>` : ""}
      ${notes.map(note => `<p class="roadmap-note">${escapeHtml(note)}</p>`).join("")}
    </section>`;
}

async function loadRoadmapForChat(chatId, force = false) {
  if (!state.token || !chatId) return;
  state.roadmaps = state.roadmaps && typeof state.roadmaps === "object" ? state.roadmaps : {};
  if (!force && Object.prototype.hasOwnProperty.call(state.roadmaps, chatId)) return;
  try {
    const data = await getJson(API.workspaceRoadmap(chatId));
    state.roadmaps[chatId] = data.roadmap || "";
    storage.set("geo_roadmaps_v1", state.roadmaps);
    if (state.activeChatId === chatId) renderMessages();
  } catch (err) {
    console.error("Failed to load roadmap:", err);
  }
}

function applyJobRoadmap(job) {
  if (!job || !job.chatId || typeof job.roadmap !== "string") return false;
  state.roadmaps = state.roadmaps && typeof state.roadmaps === "object" ? state.roadmaps : {};
  if (state.roadmaps[job.chatId] === job.roadmap) return false;
  state.roadmaps[job.chatId] = job.roadmap;
  storage.set("geo_roadmaps_v1", state.roadmaps);
  return true;
}

function addMessageNode(role, content, extraClass = "", attachments = null) {
  const row = document.createElement("div");
  row.className = `message-row ${role === "assistant" ? "assistant" : "user"} ${extraClass}`.trim();
  row.innerHTML = `
    <div class="message-inner">
      <div class="avatar ${role === "assistant" ? "assistant" : "user"}">
        ${role === "assistant" ? assistantAvatarHtml() : iconSvg("user", "icon small")}
      </div>
      <div class="msg-content-wrap">
        <div class="msg-activities" style="display:none"></div>
        <div class="msg-content"></div>
        <div class="msg-attachments"></div>
      </div>
    </div>`;
  row.querySelector(".msg-content").innerHTML = renderText(content || "");
  const attachDiv = row.querySelector(".msg-attachments");
  if (attachments && attachments.length > 0) {
    attachments.forEach(attachment => {
      const url = typeof attachment === "string" ? attachment : attachment.dataUrl;
      const name = typeof attachment === "string" ? "attachment" : (attachment.name || "attachment");
      const type = typeof attachment === "string" ? "" : (attachment.type || "");
      const isImage = url && (url.startsWith("data:image/") || type.startsWith("image/"));
      const isVideo = url && (url.startsWith("data:video/") || type.startsWith("video/") || url.includes(".mp4") || url.includes(".webm"));
      const item = document.createElement("div");
      item.className = "msg-attachment-item";
      if (isVideo) {
        item.innerHTML = `<video src="${url}" controls></video>`;
      } else if (isImage) {
        item.innerHTML = `<img src="${url}" alt="${escapeHtml(name)}" />`;
      } else {
        item.innerHTML = `<div class="msg-attachment-file"><strong>${escapeHtml(name)}</strong><small>${escapeHtml(type || "file")}</small></div>`;
      }
      attachDiv.appendChild(item);
    });
  } else {
    attachDiv.remove();
  }
  els.messages.appendChild(row);
  return row.querySelector(".msg-content");
}

  const label = mode === "instant" ? "Instant" : "Thinking Agentic Agent";
  if (els.modeMenuName) els.modeMenuName.textContent = label;
  els.modeThinkingBtn?.classList.toggle("active", mode === "thinking");
  els.modeInstantBtn?.classList.toggle("active", mode === "instant");
  closeHeaderDropdowns();
  if (notify) toast(`Response mode: ${label}`);
}

function setSearchWeb(enabled, notify = true) {
  state.searchWeb = !!enabled;

  els.searchWebBtn?.classList.toggle("active", state.searchWeb);

function toggleTopDropdown(dropdown, button, event) {
  event?.stopPropagation?.();
  if (!dropdown || !button) return;
  const willOpen = dropdown.classList.contains("hidden");
  closeHeaderDropdowns();
  dropdown.classList.toggle("hidden", !willOpen);
  button.setAttribute("aria-expanded", String(willOpen));
}

function closeHeaderDropdowns(event) {
  const target = event?.target;
  const keepModel = target?.closest?.(".model-select-container");
  const keepMode = target?.closest?.(".mode-menu-container");
  const keepWeb = target?.closest?.(".web-search-menu-container");

    els.modelDropdown?.classList.add("hidden");
    els.modelSelectBtn?.setAttribute("aria-expanded", "false");
  }
  if (!keepMode) {
    els.modeDropdown?.classList.add("hidden");

    els.webSearchDropdown?.classList.add("hidden");

function closeModelDropdown(event) {

}

/* Global state & Helper functions for terminal and status activities */
let activeAbortController = null;
let terminalSessionId = null;
let terminalPollIntervalId = null;

function parseActivities(text) {
  const activities = [];
  const toolTags = [
    "status", "search", "image_search", "write_file", "delete_file", "read_file",
    "edit_file", "run_file", "run_command", "agent_terminal", "browse_url",
    "capture_view", "run_bg_command", "check_process", "kill_process",
    "view_project_tree", "update_roadmap", "install_package", "system_info",
    "list_processes", "port_check", "http_request"
  ];
  const tagRegex = new RegExp(`<(${toolTags.join("|")})\\b([^>]*?)(?:\\s*\\/>|>([\\s\\S]*?)(?:<\\/\\1>|$))`, "ig");

  tagRegex.lastIndex = 0;
  let match;
  while ((match = tagRegex.exec(text)) !== null) {
    const tagName = match[1].toLowerCase();
    const attrs = match[2];
    const body = match[3] || "";
    const matchedText = match[0] || "";
    const isClosed = /\/\s*>$/.test(matchedText) || matchedText.toLowerCase().includes(`</${tagName}>`);
    const hasAttributes = attrs.trim().length > 0;
    const isMention = !hasAttributes && ["run_command", "run_bg_command", "agent_terminal"].includes(tagName) && !body.startsWith("\n");
    const hasFileAttr = /\b(filename|file|path)=/.test(attrs);
    const isFileTag = ["write_file", "edit_file", "read_file", "delete_file", "run_file"].includes(tagName);
    if (isFileTag && !hasFileAttr) {
      continue;
    }
    if (isMention) {
      continue;
    }
    const attr = name => attrs.match(new RegExp(`${name}="([^"]+)"`, "i"))?.[1] || "";

    let label = "";
    if (tagName === "status") {
      label = body.trim();
    } else if (tagName === "search") {
      continue;
    } else if (tagName === "image_search") {
      continue;
    } else if (tagName === "write_file" || tagName === "edit_file") {
      const fn = attr("filename") || "file";
      label = `${tagName === "write_file" ? "Writing" : "Editing"} file: ${fn}`;
    } else if (tagName === "delete_file" || tagName === "read_file" || tagName === "run_file") {
      const fn = attr("filename") || "file";
      label = `${tagName === "delete_file" ? "Deleting" : tagName === "read_file" ? "Reading" : "Running"} file: ${fn}`;
    } else if (tagName === "run_command") {
      const cmd = (body || attr("command") || "").trim();
      label = `Running command: ${cmd.split('\n')[0]}`;
    } else if (tagName === "agent_terminal") {
      const cmd = attr("command");
      label = `Interactive terminal: ${cmd}`;
    } else if (tagName === "browse_url") {
      const url = attr("url");
      label = `Browsing URL: ${url}`;
    } else if (tagName === "capture_view") {
      const url = attr("url");
      label = `Capturing browser view: ${url}`;
    } else if (tagName === "run_bg_command") {
      const cmd = (body || attr("command") || "").trim();
      label = `Starting background service: ${cmd}`;
    } else if (tagName === "check_process") {
      label = `Checking process: ${attr("pid") || "background app"}`;
    } else if (tagName === "kill_process") {
      label = `Stopping process: ${attr("pid") || "background app"}`;
    } else if (tagName === "view_project_tree") {
      label = "Viewing project tree";
    } else if (tagName === "update_roadmap") {
      label = "Updating roadmap";
    } else if (tagName === "install_package") {
      label = `Installing package: ${attr("name") || body.trim().split("\n")[0] || "dependency"}`;
    } else if (tagName === "system_info") {
      label = "Inspecting system info";
    } else if (tagName === "list_processes") {
      label = "Listing running processes";
    } else if (tagName === "port_check") {
      label = `Checking port: ${attr("host") || "127.0.0.1"}:${attr("port") || ""}`;
    } else if (tagName === "http_request") {
      label = `Requesting URL: ${attr("method") || "GET"} ${attr("url") || ""}`;
    }

    if (label) {
      activities.push({ label, done: isClosed });
    }
  }

  return activities;
}

function stripInternalTagsJS(text) {
  let clean = String(text || "");
  const fullBlockTags = [
    "status", "chat_title", "search", "image_search", "write_file", "delete_file", "read_file",
    "edit_file", "run_file", "run_command", "agent_terminal", "browse_url",
    "capture_view", "run_bg_command", "check_process", "kill_process",
    "view_project_tree", "update_roadmap", "install_package", "system_info",
    "list_processes", "port_check", "http_request"
  ];
  fullBlockTags.forEach(tag => {
    clean = clean.replace(new RegExp(`<${tag}\\b[^>]*?\\s*\\/>`, "ig"), "");
    clean = clean.replace(new RegExp(`<${tag}\\b[^>]*>[\\s\\S]*?<\\/${tag}>`, "ig"), "");
    clean = clean.replace(new RegExp(`\\[${tag}\\][\\s\\S]*?\\[\\/${tag}\\]`, "ig"), "");
  });
  fullBlockTags.forEach(tag => {
    if (["write_file", "edit_file", "read_file", "delete_file", "run_file"].includes(tag)) {
      clean = clean.replace(new RegExp(`<${tag}\\b[^>]*$`, "ig"), "");
      clean = clean.replace(new RegExp(`<${tag}\\s+[^>]*\\b(?:filename|file|path)=[^>]*>[\\s\\S]*$`, "ig"), "");
    } else if (["run_command", "run_bg_command", "agent_terminal", "update_roadmap"].includes(tag)) {
      clean = clean.replace(new RegExp(`<${tag}\\b[^>]*$`, "ig"), "");
      clean = clean.replace(new RegExp(`<${tag}\\b[^>]*>\\s*\\n[\\s\\S]*$`, "ig"), "");
    } else {
      clean = clean.replace(new RegExp(`<${tag}\\b[\\s\\S]*$`, "ig"), "");
    }
  });
  clean = clean.replace(/^\s*\[(?:image|web|real-time|realtime|api|tool|chat\s*title)[^\]\n]{0,80}\]\s*:?\s*/gim, "");
  clean = clean.replace(/^\s*chat\s+title\s*:.*$/gim, "");
  clean = clean.replace(/^\s*(?:image|web)\s+search(?:\s+tool)?\s*:.*$/gim, "");
  clean = clean.replace(/!\[[^\]]*\]\(https?:\/\/(?:www\.)?example\.com\/[^)]+\)/gi, "");
  clean = clean.replace(/\[[^\]]*\]\(https?:\/\/(?:www\.)?example\.com\/[^)]+\)/gi, "");
  return clean;
}

async function loadCronJobs() {
  const cronJobsList = $("cronJobsList");
  if (!cronJobsList) return;
  cronJobsList.innerHTML = `<div style="text-align:center; padding:20px; color:var(--faint);">Loading cron jobs...</div>`;
  try {
    const res = await fetch(endpoint("/api/cron-jobs"), {
      headers: {
        ...(state.token ? { "Authorization": `Bearer ${state.token}` } : {})
      }
    });
    const data = await res.json();
    const jobs = data.jobs || [];

    if (jobs.length === 0) {
      cronJobsList.innerHTML = `
        <div class="empty-card" style="padding: 20px; text-align: center; color: var(--faint); border: 1px dashed var(--line-soft); border-radius: var(--radius);">
          No scheduled cron jobs yet.
        </div>
      `;
      return;
    }

    cronJobsList.innerHTML = jobs.map(job => `
      <div class="cron-job-item">
        <div class="cron-job-meta">
          <div class="cron-job-name">${escapeHtml(job.name)}</div>
          <div class="cron-job-expr">Interval: ${job.interval_hours}h ${job.interval_minutes}m</div>
          <div class="cron-job-expr">Model: ${escapeHtml(formatModelName(job.model || "geocentric-local"))}</div>
          <div class="cron-job-cmd" style="max-height: 48px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Prompt: ${escapeHtml(job.prompt)}</div>
          ${job.last_run ? `<div style="font-size:10px; color:var(--faint); margin-top:2px;">Last Run: ${new Date(job.last_run * 1000).toLocaleTimeString()}</div>` : ''}
        </div>
        <button class="cron-job-delete" onclick="deleteCronJob('${job.id}')" title="Delete Cron Job">

window.deleteCronJob = async function(jobId) {
  if (!confirm("Are you sure you want to delete this scheduled cron job?")) return;
  try {
    const res = await fetch(endpoint(`/api/cron-jobs/${jobId}`), {
      method: "DELETE",
      headers: {
        ...(state.token ? { "Authorization": `Bearer ${state.token}` } : {})
      }
    });
    if (!res.ok) throw new Error("Failed to delete cron job.");
    toast("Cron job deleted successfully!");
    loadCronJobs();
  } catch (err) {
    toast(`Error: ${err.message}`);
  }
};

function createThinkingStream(anchorNode) {
  const wrap = anchorNode.closest(".msg-content-wrap");
  if (!wrap) return null;

  const shell = document.createElement("div");
  shell.className = "thinking-stream";
  shell.setAttribute("aria-label", "Thinking");

  if (state.modelMode === "instant") {
    shell.classList.add("instant");
    shell.innerHTML = `<span class="blinking-cursor"></span>`;
  } else {
    shell.innerHTML = `
      <div class="thinking-shell" style="margin-bottom: 12px;">
        <div class="glowing-status-bar">
          <span class="status-spinner"></span>
          <span>Thinking Agentic Agent:</span>
        </div>
        <div class="thinking-window" aria-live="polite" style="margin-top: 8px;"></div>
      </div>`;
  }
  wrap.insertBefore(shell, anchorNode);

  if (state.modelMode === "instant") {
    let closed = false;
    return {
      push() {},
      finish() {
        if (closed) return;
        closed = true;
        shell.classList.add("hide");
        setTimeout(() => shell.remove(), 220);
      }
    };
  }

  const windowEl = shell.querySelector(".thinking-window");
  let contentEl = null;
  if (windowEl) {
    contentEl = document.createElement("div");
    contentEl.className = "thinking-content";
    windowEl.appendChild(contentEl);
  }
  let closed = false;

  function push(value) {
    if (closed || !contentEl) return;
    const cleanText = cleanThinkingLine(value);
    if (!cleanText) return;

    contentEl.textContent = cleanText;
    windowEl.scrollTop = windowEl.scrollHeight;
  }

  push("Analyzing query...");

  return {
    push,
    finish() {
      if (closed) return;
      closed = true;
      shell.classList.add("hide");
      setTimeout(() => shell.remove(), 220);
    }
  };
}

function resizeInput() {
  els.chatInput.style.height = "auto";
